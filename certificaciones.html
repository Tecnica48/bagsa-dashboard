/* ---------------- vistas ---------------- */
function mostrar(v){
  for(const x of ["panel","consulta","def"]){ const e = document.getElementById("vista-" + x); if(e) e.hidden = (x !== v); }
  document.querySelectorAll(".nav-btn[data-vista]").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.vista === v)));
}

function iniciarVistas(d){
  D = d;
  construirIndice(d);
  renderDefiniciones(d);

  document.querySelectorAll("nav.secciones [data-ir]").forEach(a => a.addEventListener("click", e => {
    e.preventDefault(); mostrar("panel");
    history.replaceState(null, "", "#" + a.dataset.ir);
    document.getElementById(a.dataset.ir).scrollIntoView();
  }));
  document.querySelectorAll(".nav-btn[data-vista]").forEach(b => b.addEventListener("click", () => {
    const activo = b.getAttribute("aria-pressed") === "true";
    if(activo){ mostrar("panel"); history.replaceState(null, "", location.pathname + location.search); }
    else {
      mostrar(b.dataset.vista);
      history.replaceState(null, "", b.dataset.vista === "def" ? "#definiciones" : (SEL ? "#" + SEL : "#consulta"));
      if(b.dataset.vista === "consulta") document.getElementById("cons-q").focus({preventScroll:true});
    }
    window.scrollTo(0, 0);
  }));
  const dc = document.getElementById("dlg-cuenta");
  if(dc){
    dc.addEventListener("click", e => { if(e.target === dc || e.target.closest("[data-cerrar]")) dc.close(); });
    document.getElementById("vista-panel").addEventListener("click", e => { const b = e.target.closest("[data-cuenta]"); if(b) abrirCuenta(d, b.dataset.cuenta); });
  }
  document.getElementById("btn-pdf").addEventListener("click", () => document.getElementById("dlg-pdf").showModal());
  document.getElementById("pdf-cancelar").addEventListener("click", () => document.getElementById("dlg-pdf").close());
  document.getElementById("pdf-generar").addEventListener("click", generarPDF);

  const q = document.getElementById("cons-q");
  q.addEventListener("input", () => listarConsulta(q.value));
  document.getElementById("cons-lista").addEventListener("click", e => { const b = e.target.closest("[data-id]"); if(b) seleccionar(b.dataset.id); });
  document.getElementById("cons-ficha").addEventListener("click", e => { const b = e.target.closest("[data-id]"); if(b) seleccionar(b.dataset.id, {scroll:false}); });
  listarConsulta("");

  window.addEventListener("hashchange", aplicarHash);
  aplicarHash();
}

function aplicarHash(){
  const h = decodeURIComponent(location.hash.slice(1));
  if(!h) return;
  if(h === "definiciones"){ mostrar("def"); return; }
  if(h === "consulta"){ mostrar("consulta"); return; }
  if(["avance","valores","proyeccion"].includes(h)){ mostrar("panel"); const s = document.getElementById(h); if(s) s.scrollIntoView(); return; }
  if(ENT[h]){ mostrar("consulta"); seleccionar(h, {hash:false, scroll:false}); }
}

/* ---------------- índice de búsqueda ---------------- */
function estadoCorto(t){ return t ? t.estado : ""; }

function construirIndice(d){
  const E = [];
  const tram = (tipo, f) => d.tramites.find(t => t.tipo === tipo && f(t));
  [...d.certificados].reverse().forEach(c => {
    const t = tram("certificado", x => x.n === c.n), f = parseISO(c.mes + "-01");
    E.push({id:`cert-${c.n}`, g:"Certificados", t:`Certificado Nº ${c.n}`, s:`${fmtMes(c.mes+"-01")}, neto ${fmtM(c.neto)}`,
      est:estadoCorto(t), pend:!!t && t.estado !== "Pagado",
      hay:nrm(`certificado cert ${c.n} ${fmtMes(c.mes+"-01")} ${MESES_LARGO[f.getMonth()]} ${f.getFullYear()}`), html:() => fichaCert(c, t)});
  });
  [...d.ajustes].reverse().forEach(a => {
    const t = tram("ajuste", x => x.redet === a.redet);
    E.push({id:`ajuste-${a.redet}`, g:"Ajustes por redeterminación", t:`Ajuste por Redet. ${ROM[a.redet] || a.redet}`,
      s:`${fmtFecha(a.fecha)}, ${fmtM(a.netoConAnticipo ?? a.neto)}`, est:estadoCorto(t), pend:!!t && t.estado !== "Pagado",
      hay:nrm(`ajuste ajustes redet ${a.redet} ${romanoDe(a.redet)} ${fmtFecha(a.fecha)}`), html:() => fichaAjuste(a, t)});
  });
  d.anticipos.forEach(a => {
    const pct = Math.round(a.pct * 100), t = tram("anticipo", x => x.nombre === `Anticipo ${pct} %`);
    E.push({id:`anticipo-${pct}`, g:"Anticipos", t:`Anticipo ${pct} %`, s:`${fmtFecha(a.fecha)}, ${fmtM(a.monto)}`,
      est:estadoCorto(t), pend:!!t && t.estado !== "Pagado", hay:nrm(`anticipo anticipos financiero ${pct}`), html:() => fichaAnticipo(a, t)});
  });
  d.redeterminaciones.filter(r => r.redet > 0).forEach(r => {
    E.push({id:`redet-${r.redet}`, g:"Redeterminaciones", t:`Redeterminación ${ROM[r.redet] || r.redet}`,
      s:`Salto ${fmtMes(r.mesSalto)}, contrato ${fmtM(r.monto)}`, est:"", pend:false,
      hay:nrm(`redeterminacion redeterminaciones redet ${r.redet} ${romanoDe(r.redet)} salto ${fmtMes(r.mesSalto)}`), html:() => fichaRedet(r)});
  });
  d.items.forEach(i => {
    E.push({id:`item-${i.codigo}`, g:"Ítems del presupuesto", t:`Ítem ${i.codigo}`, s:i.descripcion,
      est:fmtNum((i.pctAcum||0)*100, 0) + " %", pend:false,
      hay:nrm(`item items ${i.codigo} ${i.descripcion} ${i.grupo||""} ${i.rubro||""} ${i.unidad}`), html:() => fichaItem(i)});
  });
  ENTRADAS = E; ENT = {};
  for(const e of E) ENT[e.id] = e;
}

function listarConsulta(q){
  const toks = nrm(q).split(" ").filter(Boolean);
  const cumple = e => { const w = e.hay.split(" ");
    return toks.every(t => (/^\d+$/.test(t) || /^[ivx]+$/.test(t)) ? w.includes(t) : w.some(x => x.startsWith(t))); };
  const res = ENTRADAS.filter(cumple);
  let h = "", g = null;
  for(const e of res){
    if(e.g !== g){ g = e.g; h += `<div class="cons-g">${esc(g)}</div>`; }
    h += `<button type="button" class="cons-it${e.id === SEL ? " sel" : ""}" data-id="${esc(e.id)}"><span class="t">${esc(e.t)}</span>` +
         `<span class="est${e.pend ? " abierto" : ""}">${esc(e.est || "")}</span><span class="s">${esc(e.s)}</span></button>`;
  }
  if(!res.length) h = `<div class="cons-vacio">No hay resultados para «${esc(q)}». Probá con «cert 12», «ajuste 3», «redet IV» o parte del nombre de un ítem.</div>`;
  document.getElementById("cons-res").innerHTML = h;
}

function seleccionar(id, {hash = true, scroll = true} = {}){
  const e = ENT[id]; if(!e) return;
  SEL = id;
  const fi = document.getElementById("cons-ficha");
  fi.innerHTML = e.html();
  document.querySelectorAll(".cons-it").forEach(b => b.classList.toggle("sel", b.dataset.id === id));
  if(hash) history.replaceState(null, "", "#" + id);
  if(scroll && window.matchMedia("(max-width:900px)").matches) fi.scrollIntoView({block:"start"});
}

/* ---------------- fichas ---------------- */
const fila = (l, v, cls = "", vcls = "") => `<div class="f-fila ${cls}"><span>${l}</span><span class="v ${vcls}">${v}</span></div>`;
const chip = (id, txt) => ENT[id] ? `<button type="button" class="chip" data-id="${esc(id)}">${esc(txt)}</button>` : esc(txt);
const fHead = (tit, sub) => `<h3 class="f-tit">${esc(tit)}</h3><p class="f-sub">${sub}</p>`;

function circuito(t){
  if(!t) return `<p class="f-nota">Este comprobante no figura en la TABLA MASTER del seguimiento.</p>`;
  const et = [["fechaCert","Emitido"],["acta","Acta de medición"],["envio","Enviado al contratista"],["entrada","Factura recibida"],["tesoreria","Entregado a Tesorería"],["pago","Pagado"]];
  const pasos = et.filter(([k]) => t[k]).map(([k, l]) => ({l, f:t[k]})).sort((a, b) => a.f.localeCompare(b.f));
  let prev = null, h = `<div class="tabla-wrap"><table class="f-pasos"><thead><tr><th>Etapa</th><th>Fecha</th><th class="n">Días desde la anterior</th></tr></thead><tbody>`;
  for(const p of pasos){
    const dias = prev ? Math.round((parseISO(p.f) - parseISO(prev)) / 864e5) : null;
    h += `<tr><td>${p.l}</td><td>${fmtFecha(p.f)}</td><td class="n d">${dias == null ? "—" : dias}</td></tr>`;
    prev = p.f;
  }
  h += `</tbody></table></div>`;
  h += t.estado === "Pagado"
    ? `<p class="f-nota">Desde la emisión hasta el pago: <b>${t.diasCertAPago ?? "—"} días</b>.</p>`
    : `<p class="f-nota">En trámite: <b>${esc(t.estado)}</b>. Pago estimado: <b>${fmtFecha(t.pagoEstimado)}</b>.</p>`;
  return h;
}
function extrasT(t){
  if(!t) return "";
  let h = "";
  if(t.factura) h += `<div class="f-sec"><h4>Factura</h4><p class="f-nota">${esc(t.factura)}</p></div>`;

}

function generarPDF(){
  const dlg = document.getElementById("dlg-pdf");
  const marcados = new Set([...dlg.querySelectorAll("input:checked")].map(i => i.value));
  dlg.close();
  mostrar("panel");
  const tocados = [], abiertos = [];
  document.querySelectorAll("#vista-panel [data-pdf]").forEach(el => { if(!marcados.has(el.dataset.pdf)){ el.classList.add("pdf-oculto"); tocados.push(el); } });
  document.querySelectorAll("#vista-panel section").forEach(sec => {
    const hijos = sec.querySelectorAll("[data-pdf]");
    if(hijos.length && [...hijos].every(h => h.classList.contains("pdf-oculto"))){ sec.classList.add("pdf-oculto"); tocados.push(sec); }
  });
  if(marcados.has("historial")) document.querySelectorAll('[data-pdf="historial"] details').forEach(x => { abiertos.push([x, x.open]); x.open = true; });
  const tituloPrevio = document.title;
  document.title = `Certificaciones ${D.obra.nombre} - datos al ${String(D.generatedAt).replace(/\//g, "-")}`;
  const limpiar = () => {
    tocados.forEach(el => el.classList.remove("pdf-oculto"));
    abiertos.forEach(([x, v]) => { x.open = v; });
    document.title = tituloPrevio;
    window.removeEventListener("afterprint", limpiar);
  };
  window.addEventListener("afterprint", limpiar);
  window.scrollTo(0, 0);
  setTimeout(() => window.print(), 80);
}


/* ============================================================
   Índice general de certificaciones (certificaciones.html sin ?obra=)
   Lee certificaciones_indice.json: todos los comprobantes de la planilla de seguimiento.
   El estado, las demoras y los pagos estimados se calculan acá con la fecha de hoy.
   ============================================================ */
const sello = d => { const m = /^(\d+)\/(\d+)\/(\d+)$/.exec((d && d.generatedAt) || ""), h = /^(\d+):(\d+)/.exec((d && d.generatedTime) || "0:0");
  return m ? new Date(+m[3], +m[2] - 1, +m[1], +h[1], +h[2]).getTime() : 0; };
async function leerJSON(ruta, ms){
  const ctl = new AbortController(), t = setTimeout(() => ctl.abort(), ms);
  try{ const r = await fetch(ruta, {cache:"no-store", signal:ctl.signal}); if(r.ok) return await r.json(); }catch(e){ /* no disponible */ }
  finally{ clearTimeout(t); }
  return null;
}
/* Como Panel_Extensiones: compara los datos de la carpeta data/ y de la web, y usa los más nuevos.
   Abierta con doble clic (file://) el navegador no deja leer .json de disco, pero sí cargar scripts: por eso el script
   actualizar_certificaciones.py deja también data/certificaciones_*.js. Con datos locales el panel se dibuja AL INSTANTE;
   la web se consulta en segundo plano y, solo si trae algo más nuevo, el panel se redibuja.
   Publicada en GitHub lee los JSON de data/. */
function leerJS(nombre, ms){
  const base = nombre.replace(/\.json$/, ".js");
  const probar = ruta => new Promise(res => {
    const sc = document.createElement("script"), t = setTimeout(() => { sc.remove(); res(null); }, ms);
    sc.onload = () => { clearTimeout(t); sc.remove(); res((window.__DATOS_JS || {})[nombre] || null); };
    sc.onerror = () => { clearTimeout(t); sc.remove(); res(null); };
    sc.src = ruta + "?t=" + Date.now(); document.head.appendChild(sc);
  });
  return probar("data/" + base).then(d => d || probar(base));
}
async function traerJSON(nombre, alActualizar){
  let emb = (window.__DATOS__ && window.__DATOS__[nombre]) || null, fe = "archivo del panel";
  if(!emb && LOCAL){ emb = await leerJS(nombre, 4000); fe = "carpeta"; }
  const fuera = async () => {
    const rutas = [["data/" + nombre, "carpeta"], [nombre, "carpeta"]];
    if(LOCAL || emb) rutas.push([JSON_WEB + nombre, "web"]);   // publicado en GitHub no hace falta mirar la web: es la misma carpeta
    const r = await Promise.all(rutas.map(([u]) => leerJSON(u, emb ? 6000 : 4000)));
    const c = r.map((d, i) => d && {d, f:rutas[i][1]}).filter(Boolean);
    return c.length ? c.reduce((m, x) => sello(x.d) > sello(m.d) ? x : m) : null;
  };
  if(emb){
    FUENTE[nombre] = fe;
    const cd = document.getElementById("cab-der"); if(cd) cd.classList.add("buscando");
    const listo = () => { const x = document.getElementById("cab-der"); if(x) x.classList.remove("buscando"); };
    fuera().finally(listo).then(m => { if(m && sello(m.d) > sello(emb)){ FUENTE[nombre] = m.f; if(alActualizar) alActualizar(m.d); } }).catch(() => {});
    return emb;
  }
  const m = await fuera();
  if(!m) throw new Error("sin datos");
  FUENTE[nombre] = m.f;
  return m.d;
}

function prepararIx(d){
  const R = d.reglas, M = d.medianas;
  IX.d = d;
  IX.C = d.comprobantes.map(c => {
    const x = {...c, fechas:{}};
    for(const e of ETA) if(c[e.k]) x.fechas[e.k] = parseISO(c[e.k]);
    let et = null; for(const e of ETA) if(x.fechas[e.k]) et = e.k;     // etapa más avanzada
    x.etapa = et; x.fEtapa = et ? x.fechas[et] : null; x.pagado = et === "pago";
    x.dias = (!x.pagado && x.fEtapa) ? Math.round((IX.hoy - x.fEtapa) / 864e5) : null;
    const med = (et && M[et] != null) ? M[et] : null;
    x.med = med;
    x.estimado = (!x.pagado && x.fEtapa && med != null) ? addDays(x.fEtapa, med) : null;
    x.antiguo = !x.pagado && (!x.fEtapa || x.dias > R.antiguoDias);
    x.demorado = !x.pagado && !x.antiguo && med != null && x.dias > med * R.demoraFactor;
    x.estadoTxt = et ? ETA_K[et].estado : "Sin fechas";
    x.hay = nrm(`${x.obra} ${x.empresa} ${x.label} ${x.tema} ${x.estadoTxt}`);
    return x;
  });
  IX.porId = Object.fromEntries(IX.C.map(c => [String(c.id), c]));
}

/* ---------------- proyección de pagos ---------------- */
const PY = {mes:null};
const mesKey = d => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}`;
const mesTxt = (k, corto) => { const [a, m] = k.split("-"); return corto ? `${MESES_LARGO[m - 1].slice(0, 3)}-${a.slice(2)}` : `${MESES_LARGO[m - 1]} ${a}`; };
const mesMas = (k, n) => { const [a, m] = k.split("-").map(Number); const d = new Date(a, m - 1 + n, 1); return mesKey(d); };
const fechaCert = c => c.fechas.envio || c.fechas.acta || c.fechas.entrada || null;

function armarProy(M){
  // En trámite: lo que tiene fechas en el seguimiento, en el mes de su pago estimado.
  // Pendientes: ajustes con el cálculo hecho y sin fechas (en el mes actual y los siguientes).
  // Historial: lo que se pagó en el mes, en gris.
  const hoyK = mesKey(IX.hoy), pasado = M < hoyK;
  const okF = x => x.obraKey !== "(SIN OBRA)" && (!IX.obra || x.obraKey === IX.obra) && (!IX.empresa || (x.empresa || "").toUpperCase().includes(IX.empresa.toUpperCase().slice(0, 12)));
  const deC = c => ({obra:c.obra, empresa:c.empresa, tema:c.tema, fecha:fechaCert(c), pago:c.fechas.pago || null, monto:c.monto, id:c.id, tipo:c.tipo});
  const pan = IX.C.filter(c => !c.pagado && !c.antiguo && c.fEtapa && c.estimado && mesKey(c.estimado) === M && okF(c));
  const certs = pan.filter(c => c.tipo !== "anticipo").map(deC);
  const ants = pan.filter(c => c.tipo === "anticipo").map(deC);
  const pag = IX.C.filter(c => c.pagado && mesKey(c.fechas.pago) === M && okF(c)).map(deC);
  let ajp = [];
  if(!pasado){
    const sinFecha = IX.C.filter(c => !c.pagado && c.tipo === "ajuste" && !c.fEtapa && okF(c));
    const ids = new Set(sinFecha.map(c => String(c.id)));
    ajp = [...sinFecha.map(deC).map(x => ({...x, fecha:null})),
           ...(IX.d.pendientes || []).filter(x => okF(x) && !(x.idSeguimiento != null && ids.has(String(x.idSeguimiento))))
             .map(x => ({obra:x.obra, empresa:x.empresa, tema:x.tema, fecha:null, monto:x.monto, id:null, tipo:"ajuste"}))];
  }
  const suma = a => a.reduce((t, x) => t + (x.monto || 0), 0);
  return {certs, ants, ajp, pag, pasado, tCert:suma(certs), tAnt:suma(ants), tAjp:suma(ajp), tPag:suma(pag)};
}

function mesesProy(){
  // historial de los últimos 12 meses (los que tienen algo) y, hacia adelante, hasta el último pago estimado
  const hoyK = mesKey(IX.hoy);
  const ult = IX.C.filter(c => !c.pagado && !c.antiguo && c.estimado).map(c => mesKey(c.estimado)).reduce((m, k) => k > m ? k : m, mesMas(hoyK, 1));
  const out = [];
  for(let k = mesMas(hoyK, -12); k <= ult && out.length < 36; k = mesMas(k, 1)){
    if(k >= hoyK){ out.push(k); continue; }
    const d = armarProy(k); if(d.pag.length || d.certs.length || d.ants.length) out.push(k);
  }
  return out;
}

function pintarProy(){
  const meses = mesesProy(), hoyK = mesKey(IX.hoy);
  if(!meses.length){ gid("py-cuerpo").innerHTML = '<p class="py-vacio">No hay comprobantes para proyectar.</p>'; return; }
  if(!PY.mes || !meses.includes(PY.mes)){ const sig = mesMas(hoyK, 1); PY.mes = meses.includes(sig) ? sig : (meses.find(k => k >= hoyK) || meses[meses.length - 1]); }

  gid("py-prev").disabled = meses.indexOf(PY.mes) <= 0; gid("py-next").disabled = meses.indexOf(PY.mes) >= meses.length - 1;
  const d = armarProy(PY.mes), trab = mesTxt(mesMas(PY.mes, -2), true);
  const hist = d.pag.length ? `<div class="py-hist"><h4 class="py-h">Pagado en ${mesTxt(PY.mes)}</h4>
    <table class="py-tabla">${cabPy}<tbody>${filasPy(d.pag)}<tr class="tot"><td colspan="4">Total pagado</td><td class="n">${fmtPesos(d.tPag)}</td></tr></tbody></table></div>` : "";
  if(d.pasado){
    const sinPagar = [...d.certs, ...d.ants];
    gid("py-cuerpo").innerHTML = `<div class="py-hist"><p class="py-nota">Historial: ${mesTxt(PY.mes)} ya pasó.</p>
      <div class="py-res"><div style="--c:#8a9aa8;--t:#f1f4f6"><div class="l">Pagado en el mes</div><div class="v">${fmtM(d.tPag)}</div></div>
      ${sinPagar.length ? `<div style="--c:#8a9aa8;--t:#f1f4f6"><div class="l">Proyectado y sin pagar</div><div class="v">${fmtM(d.tCert + d.tAnt)}</div></div>` : ""}</div></div>
      ${hist || '<p class="py-vacio">No hubo pagos en este mes.</p>'}
      ${sinPagar.length ? `<h4 class="py-h">Proyectado para ${mesTxt(PY.mes)} y todavía sin pagar</h4>
        <table class="py-tabla">${cabPy}<tbody>${filasPy(sinPagar)}<tr class="tot"><td colspan="4">Total</td><td class="n">${fmtPesos(d.tCert + d.tAnt)}</td></tr></tbody></table>` : ""}`;
    return;
  }

/* ---------------- calendario ---------------- */
function eventosIx(){
  const ev = [], M_IX = IX.d.medianas || {};
  for(const c of visiblesIx()){
    const pres = ETA.filter(e => c.fechas[e.k]);
    if(IX.modo === "curso"){
      if(c.pagado || c.antiguo) continue;
      pres.slice(-2).forEach(e => ev.push({c, k:e.k, f:c.fechas[e.k], est:false}));
    } else {
      pres.forEach(e => ev.push({c, k:e.k, f:c.fechas[e.k], est:false}));
    }
    if(!c.pagado && !c.antiguo && c.estimado){
      // etapas que faltan: se estiman hacia atrás desde el pago estimado (mediana de días de cada etapa hasta el pago)
      const ult = ETA.findIndex(e => e.k === c.etapa);
      ETA.forEach((e, i) => {
        if(i <= ult) return;
        const f = e.k === "pago" ? c.estimado : (M_IX[e.k] != null ? addDays(c.estimado, -M_IX[e.k]) : null);
        if(f && (e.k === "pago" || f >= IX.hoy)) ev.push({c, k:e.k, f, est:true});
      });
    }
  }
  const rango = {pago:5, tesoreria:4, entrada:3, envio:2, acta:1};
  return ev.sort((a, b) => (rango[b.k] - rango[a.k]) || a.c.obra.localeCompare(b.c.obra));
}

function chipIx(x){
  const c = x.c, e = ETA_K[x.k];
  const atrasado = x.est && x.f < IX.hoy;
  const futuro = !x.est && x.f > IX.hoy;      // fecha cargada pero posterior a hoy
  const corto = x.est ? `${e.corto} est.` : e.corto;
  let tip = `${x.est ? e.largo + " (fecha estimada)" : futuro ? e.largo + " (fecha posterior a hoy)" : e.largo}: ${c.obra}, ${c.label} (${c.empresa})`;
  if(c.demorado) tip += `. Demorado: ${diasTxt(c.dias)} en esta etapa, lo normal es hasta ${Math.round(c.med * IX.d.reglas.demoraFactor)}`;
  if(atrasado) tip += ". La fecha estimada ya pasó";
  return `<button type="button" class="ev ev-${x.k}${x.est || futuro ? " est" : ""}${atrasado ? " atrasado" : ""}${c.demorado ? " dem" : ""}" data-id="${c.id}" title="${esc(tip)}" aria-label="${esc(tip)}"><span class="tx"><b>${corto}</b><span class="nm">${esc(c.obra)} ${esc(c.label)}</span></span></button>`;
}

function pintarCal(){
  const y = IX.mes.getFullYear(), m = IX.mes.getMonth();
  gid("cal-mes").textContent = `${MESES_LARGO[m]} ${y}`;
  const mapa = {};
  for(const x of eventosIx()){ (mapa[ymd(x.f)] ||= []).push(x); }
  const offset = (IX.mes.getDay() + 6) % 7;
  const ini = new Date(y, m, 1 - offset);
  const dias = new Date(y, m + 1, 0).getDate();
  const filas = Math.ceil((offset + dias) / 7);
  let h = "", delMes = 0;
  for(let i = 0; i < filas * 7; i++){
    const f = new Date(ini.getFullYear(), ini.getMonth(), ini.getDate() + i);
    const k = ymd(f), ev = mapa[k] || [], fuera = f.getMonth() !== m;
    if(!fuera) delMes += ev.length;
    const max = 3;
    h += `<div class="dia${fuera ? " fuera" : ""}${ymd(f) === ymd(IX.hoy) ? " hoy" : ""}" data-f="${k}">
      <button type="button" class="dn" data-dia aria-label="Ver el ${f.getDate()} de ${MESES_LARGO[f.getMonth()]}">${f.getDate()}</button>
      <div class="evs">${ev.slice(0, max).map(chipIx).join("")}</div>
      ${ev.length > max ? `<button type="button" class="mas" data-dia>+${ev.length - max} más</button>` : ""}</div>`;
  }
  gid("cal-grid").innerHTML = h;
  const vacio = gid("cal-vacio");
  vacio.hidden = delMes > 0;
  vacio.textContent = IX.modo === "curso"
    ? "No hay trámites en curso con fechas en este mes. Probá con el mes siguiente o pasá a Historial para ver lo que ya pasó."
    : "No hay movimientos con estos filtros en este mes.";
}

      <div><h3>${esc(o.nombre)}</h3><div class="emp">${esc(o.empresas.join(", "))}</div></div>
      <div class="oc-nums">
        <div><span class="l">Pagado</span><b>${fmtM(sumaIx(pag))}</b><span class="s">${pag.length} ${pag.length === 1 ? "pago" : "pagos"}</span></div>
        <div><span class="l">En trámite</span><b>${fmtM(sumaIx(act))}</b><span class="s">${act.length} ${act.length === 1 ? "comprobante" : "comprobantes"}</span></div>
      </div>
      <div class="oc-pie"><span>${n} comprobantes</span><span>Último pago: ${ult ? fmtDate(ult) : "—"}</span>${rev ? `<span class="tag">${rev} para revisar</span>` : ""}</div>
      <div class="oc-acc">
        <button type="button" class="btn" data-filtrar="${esc(o.key)}">${IX.obra === o.key ? "Quitar filtro" : "Ver en el calendario"}</button>
        ${o.panel ? `<a class="btn prim" href="${esc(urlPanelIx(o))}">Abrir panel</a>` : '<span class="sin">Sin panel todavía</span>'}
      </div>
    </article>`).join("");
}

/* ---------------- ficha de un comprobante ---------------- */
function enlacePanelIx(c){
  const o = IX.d.obras.find(x => x.key === c.obraKey);
  if(!o || !o.panel) return "";
  let h = "";
  if(c.tipo === "certificado" && c.n != null) h = `#cert-${c.n}`;
  else if(c.tipo === "ajuste" && c.redet) h = `#ajuste-${c.redet}`;
  else if(c.tipo === "anticipo" && c.pct) h = `#anticipo-${Math.round(c.pct * 100)}`;
  return urlPanelIx(o) + h;
}

function abrirFichaIx(id){
  const c = IX.porId[String(id)]; if(!c) return;
  const pasos = ETA.filter(e => c.fechas[e.k]).map(e => ({l:e.largo, f:c.fechas[e.k]})).sort((a, b) => a.f - b.f);
  let prev = null, tabla = "";
  if(pasos.length){
    tabla = `<div class="tabla-wrap"><table class="f-pasos"><thead><tr><th>Etapa</th><th>Fecha</th><th class="n">Días desde la anterior</th></tr></thead><tbody>` +
      pasos.map(p => { const dd = prev ? Math.round((p.f - prev) / 864e5) : null; prev = p.f;
        return `<tr><td>${p.l}</td><td>${fmtDate(p.f)}</td><td class="n d">${dd == null ? "—" : dd}</td></tr>`; }).join("") + `</tbody></table></div>`;
  }
  let situacion = "";
  if(c.pagado){
    situacion = `<p class="f-nota">Desde la primera fecha cargada hasta el pago: <b>${diasTxt(Math.round((c.fechas.pago - pasos[0].f) / 864e5))}</b>.</p>`;
  } else if(c.antiguo){
    situacion = `<p class="f-nota"><b>Para revisar:</b> ${c.fEtapa ? `lleva ${diasTxt(c.dias)} sin movimiento` : "no tiene ninguna fecha cargada"}. Probablemente ya se pagó y falta cargar el pago en la planilla.</p>`;
  } else {
    situacion = `<p class="f-nota">${c.demorado ? `<b>Demorado:</b> lleva ${diasTxt(c.dias)} en esta etapa y lo normal es hasta ${Math.round(c.med * IX.d.reglas.demoraFactor)}. ` : ""}Falta: <b>${ACCION[c.etapa]}</b>.${c.estimado ? ` Pago estimado el <b>${fmtDate(c.estimado)}</b>.` : ""}</p>`;
  }
  const enlace = enlacePanelIx(c);
  gid("dlg-ficha").innerHTML = `<button type="button" class="cerrar" data-cerrar>Cerrar</button>
    <h3 class="f-tit">${esc(c.obra)}, ${esc(c.label)}</h3>
    <p class="f-sub">${esc(c.empresa)}. ${esc(c.tema)}</p>
    <div class="f-sec"><h4>Estado</h4>
      ${fila("Etapa actual", esc(c.estadoTxt), "", c.antiguo || c.demorado ? "alerta" : "")}
      ${fila("Monto a pagar", fmtM(c.monto), "total")}
    </div>
    <div class="f-sec"><h4>Circuito de cobro</h4>${tabla || '<p class="f-nota">No tiene fechas cargadas.</p>'}${situacion}</div>
    ${c.factura ? `<div class="f-sec"><h4>Factura</h4><p class="f-nota">${esc(c.factura)}</p></div>` : ""}
    ${c.poliza ? `<div class="f-sec"><h4>Garantías</h4><p class="f-nota">${esc(c.poliza)}</p></div>` : ""}
    ${c.obs ? `<div class="f-sec"><h4>Observaciones del seguimiento</h4><p class="f-nota">${esc(c.obs)}</p></div>` : ""}
    ${enlace ? `<p style="margin:18px 0 0"><a class="btn prim" href="${enlace}" style="text-decoration:none;display:inline-block">Abrir en el panel de ${esc(c.obra)}</a></p>` : ""}`;
  gid("dlg-ficha").showModal();
}

/* ---------------- cómo se calcula y control de datos ---------------- */
function comoIx(d){
  const m = d.medianas, r = d.reglas;
  return `<ul class="ix-como" style="padding-left:18px">
    <li><b>Etapas.</b> Acta de medición, envío al contratista, factura recibida, entrega a Tesorería y pago. Cada trámite está en la etapa más avanzada que tiene fecha. Las fechas salen de la TABLA MASTER del seguimiento.</li>
    <li><b>En trámite.</b> Comprobantes sin fecha de pago y con un movimiento de hace menos de ${r.antiguoDias} días.</li>
    <li><b>Pago estimado.</b> Fecha de la última etapa más los días que suele tardar desde esa etapa hasta el pago, que son la mediana de todas las obras sin contar a TGS: ${m.acta} desde el acta, ${m.envio} desde el envío, ${m.entrada} desde la factura y ${m.tesoreria} desde Tesorería.</li>
    <li><b>Demorado.</b> Lleva en su etapa más de ${String(r.demoraFactor).replace(".", ",")} veces esos días.</li>
    <li><b>Para revisar.</b> Más de ${r.antiguoDias} días sin movimiento o sin ninguna fecha. Se supone que el pago está sin cargar, y por eso no se suman al trámite ni al calendario en curso.</li>
    <li><b>Quién mueve cada etapa.</b> Le toca a BAGSA enviar el acta al contratista y entregar la factura a Tesorería. Después de enviar espera al contratista, y en Tesorería espera el pago.</li>
    <li><b>Montos.</b> Es el «monto a pagar» de la planilla, y solo se ven en los indicadores, las tarjetas de obra y las fichas.</li>
  </ul>`;
}

function avisosIx(d){
  const por = t => d.avisos.filter(a => a.tipo === t);
  const lista = (titulo, a) => a.length ? `${titulo ? `<h4>${titulo} (${a.length})</h4>` : ""}<ul>${a.map(x => `<li><span class="fila">Fila ${x.fila}.</span> ${esc(x.texto)}</li>`).join("")}</ul>` : "";
  const graves = por("desorden").filter(a => !a.leve), leves = por("desorden").filter(a => a.leve);
  const cuerpo = lista("Sin obra asignada", por("sin_obra")) + lista("Fechas que parecen mal cargadas", por("fecha_rara")) +
    lista("Texto en lugar de fecha", por("texto_en_fecha")) + lista("Etapas en desorden por más de 3 días", graves) +
    (leves.length ? `<details style="margin-top:12px"><summary>Etapas en desorden por 3 días o menos (${leves.length})</summary>${lista("", leves)}</details>` : "");
  return `<p class="nota" style="margin-top:8px">Diferencias de la planilla de seguimiento que conviene corregir en el Excel. El número de fila es el de la hoja TABLA MASTER.</p>${cuerpo || "<p>No se encontraron problemas.</p>"}`;
}

/* ============================================================
   Animaciones. Todo se agrega "desde afuera": mira lo que se va dibujando en #app y le da vida.
   No cambia datos ni textos finales. Se desactiva con "reducir movimiento" del sistema.
   ============================================================ */
const MOVER = !matchMedia("(prefers-reduced-motion: reduce)").matches;
function deslizar(dir){
  if(!MOVER) return;
  const g = document.getElementById("cal-grid"); if(!g || !g.animate) return;
  g.animate([{opacity:0, transform:`translateX(${dir * 28}px)`}, {opacity:1, transform:"none"}], {duration:300, easing:"cubic-bezier(.2,.7,.2,1)"});
}
(function(){
  if(!MOVER || !window.IntersectionObserver) return;
  document.documentElement.classList.add("anim");
  const hechos = new WeakSet(), accion = new WeakMap(), finales = [], restaurar = [], ANT = {};
  const ease = t => 1 - Math.pow(1 - t, 3);
  const io = new IntersectionObserver(es => {
    let i = 0;
    for(const e of es){
      if(!e.isIntersecting) continue;
      io.unobserve(e.target);
      const f = accion.get(e.target); if(f) f(i++);
    }
  }, {threshold:.15, rootMargin:"0px 0px -4% 0px"});
  const mirar = (el, f) => { accion.set(el, f); io.observe(el); };

  // 1. aparición escalonada
  function reveal(el){
    el.classList.add("rev");
    mirar(el, i => {
      el.style.setProperty("--d", Math.min(i, 7) * 70 + "ms");
      requestAnimationFrame(() => el.classList.add("in"));
      let fin = false; const quitar = () => { if(fin) return; fin = true; el.classList.remove("rev", "in"); el.style.removeProperty("--d"); };
      el.addEventListener("transitionend", quitar, {once:true});
      setTimeout(quitar, 1500);
    });
  }

  // 2. números que cuentan hasta su valor
  function contador(el){
    const nodo = [...el.childNodes].find(n => n.nodeType === 3 && /\d/.test(n.nodeValue));
    if(!nodo) return;
    const m = /^(.*?)(-?)(\d[\d.]*)(?:,(\d+))?(.*)$/s.exec(nodo.nodeValue);
    if(!m) return;
    const [, pre, signo, ent, dec, post] = m, nd = dec ? dec.length : 0;
    const meta = parseFloat(ent.replace(/\./g, "") + "." + (dec || "0"));
    const txt = v => pre + (signo && v > 0 ? "-" : "") + fmtNum(v, nd) + post;
    const final = nodo.nodeValue;
    finales.push([nodo, final]);
    const clave = el.closest("[data-kpi]") ? el.closest("[data-kpi]").dataset.kpi : null;
    const desde = clave && ANT[clave] != null ? ANT[clave] : 0;
    if(clave) ANT[clave] = meta;
    if(desde === meta) return;
    const dur = clave && desde ? 600 : 1100;
    nodo.nodeValue = txt(desde);
    const correr = () => {
      const t0 = performance.now();
      const paso = t => { const k = Math.min(1, (t - t0) / dur); nodo.nodeValue = k < 1 ? txt(desde + (meta - desde) * ease(k)) : final; if(k < 1) requestAnimationFrame(paso); };
      requestAnimationFrame(paso);
    };
    if(clave && desde) correr(); else mirar(el, correr);
  }

  // 3. barras que se llenan
  function barra(sp){
    const w = sp.style.width; if(!w) return;
    restaurar.push(() => { sp.style.transition = "none"; sp.style.width = w; });
    sp.style.transition = "none"; sp.style.width = "0%";
    mirar(sp, i => requestAnimationFrame(() => { sp.style.transition = "width 1s cubic-bezier(.2,.7,.2,1) " + Math.min(i, 8) * 40 + "ms"; sp.style.width = w; }));
  }

  // 4. gráficos: la línea se dibuja, lo demás aparece detrás
  function grafico(sv){
    if(!sv.animate) return;
    const lineas = [...sv.querySelectorAll("polyline")];
    const solidas = lineas.filter(l => !l.getAttribute("stroke-dasharray"));
    const rects = [...sv.querySelectorAll("rect")].filter(r => (r.getAttribute("height") || 0) < 20);
    const resto = [...sv.querySelectorAll("circle, text, line, polyline[stroke-dasharray], g > rect")].filter(x => !rects.includes(x));
    const fantasma = (e, delay) => { e.style.opacity = "0"; return () => { const a = e.animate([{opacity:0}, {opacity:e.getAttribute("opacity") || 1}], {duration:500, delay, fill:"forwards", easing:"ease-out"}); a.onfinish = () => { e.style.opacity = ""; a.cancel(); }; }; };
    const fades = resto.map((e, i) => fantasma(e, 350 + Math.min(i, 30) * 25));
    solidas.forEach(l => l.setAttribute("pathLength", "1"));
    rects.forEach(r => { r.style.transformBox = "fill-box"; r.style.transformOrigin = "0 50%"; r.style.transform = "scaleX(0)"; });
    solidas.forEach(l => { l.style.strokeDasharray = "1"; l.style.strokeDashoffset = "1"; });
    restaurar.push(() => { rects.forEach(r => { r.style.transform = ""; }); solidas.forEach(l => { l.style.strokeDasharray = ""; l.style.strokeDashoffset = ""; }); resto.forEach(e => { e.style.opacity = ""; }); });
    mirar(sv, () => {
      rects.forEach((r, i) => { const a = r.animate([{transform:"scaleX(0)"}, {transform:"scaleX(1)"}], {duration:900, delay:i * 120, fill:"forwards", easing:"cubic-bezier(.2,.7,.2,1)"}); a.onfinish = () => { r.style.transform = ""; a.cancel(); }; });
      solidas.forEach(l => { const a = l.animate([{strokeDashoffset:1}, {strokeDashoffset:0}], {duration:1300, fill:"forwards", easing:"cubic-bezier(.4,.1,.2,1)"}); a.onfinish = () => { l.style.strokeDasharray = ""; l.style.strokeDashoffset = ""; a.cancel(); }; });
      fades.forEach(f => f());
    });
  }

  const REVEAL = ".kpis:not(#ix-kpis) > .kpi, #ix-kpis, section > h2, section > .bajada, .panel, .panel-card, .linea, .obra-head, .cal-grid";
  function escanear(){
    const app = document.getElementById("app");
    app.querySelectorAll(REVEAL).forEach(e => { if(!hechos.has(e) && !e.closest("dialog")){ hechos.add(e); reveal(e); } });
    app.querySelectorAll(".kpi .v, .linea .pct").forEach(e => { if(!hechos.has(e)){ hechos.add(e); contador(e); } });
    app.querySelectorAll(".barra > span").forEach(e => { if(!hechos.has(e)){ hechos.add(e); barra(e); } });
    app.querySelectorAll("svg").forEach(e => { if(!hechos.has(e) && !e.closest(".graf-py") && e.querySelector("polyline, rect")){ hechos.add(e); grafico(e); } });
  }
  let pend = false;
  new MutationObserver(() => { if(pend) return; pend = true; requestAnimationFrame(() => { pend = false; try{ escanear(); }catch(e){ /* la animación nunca debe romper el panel */ } }); })
    .observe(document.getElementById("app"), {childList:true, subtree:true});

  // al imprimir o exportar a PDF, todo en su valor final
  window.addEventListener("beforeprint", () => {
    finales.forEach(([n, t]) => { n.nodeValue = t; });
    document.querySelectorAll(".rev").forEach(e => e.classList.remove("rev", "in"));
    restaurar.forEach(f => { try{ f(); }catch(e){} });
    if(document.getAnimations) document.getAnimations().forEach(a => { try{ a.finish(); }catch(e){} });
  });
})();
</script>
</body>
