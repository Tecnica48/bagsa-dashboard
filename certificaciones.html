<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Certificaciones — BAGSA</title>
<style>
  :root{
    --navy:#005895; --navy2:#0b4c7b; --teal:#00aec3; --teal-soft:#e3f6f8; --blue-bright:#008ed7;
    --bg:#f3f7fa; --panel:#ffffff; --border:#dbe6ee; --grid:#e9f0f5;
    --text:#16303f; --text-muted:#5c7688;
    --amber:#d9822b; --amber-soft:#fbeedd; --ok:#2e9e62;
    --sans: Calibri, "Segoe UI", -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif;
    --display: "Calibri Light", Calibri, "Segoe UI", -apple-system, sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  html{scroll-padding-top:calc(64px + env(safe-area-inset-top,0px));}
  body{
    background:var(--bg); color:var(--text); font-family:var(--sans);
    -webkit-font-smoothing:antialiased; font-variant-numeric:tabular-nums;
    padding:calc(28px + env(safe-area-inset-top,0px)) 24px calc(60px + env(safe-area-inset-bottom,0px));
  }
  .wrap{max-width:1280px;margin:0 auto;}
  a{color:var(--navy);}
  :focus-visible{outline:2px solid var(--blue-bright);outline-offset:2px;}

  header{display:flex;align-items:center;gap:20px;border-bottom:3px solid var(--teal);padding-bottom:18px;}
  header img{height:64px;width:auto;display:block;}
  .brand-div{width:1px;align-self:stretch;background:var(--border);}
  .brand-text .empresa{font-size:13px;color:var(--text-muted);}
  .brand-text .area{font-family:var(--display);color:var(--navy);font-size:22px;}
  .volver{margin-left:auto;font-size:13px;text-decoration:none;font-weight:700;white-space:nowrap;}
  @media (max-width:600px){
    body{padding-left:16px;padding-right:16px;}
    header{gap:12px;} header img{height:42px;} .brand-div{display:none;}
    .brand-text .empresa{font-size:11.5px;} .brand-text .area{font-size:17px;}
    nav.secciones .act{margin-left:0;width:100%;padding-left:12px;}
    .linea{padding:22px 18px 18px;}
  }
  .volver:hover{text-decoration:underline;}

  /* Navegación entre secciones */
  nav.secciones{
    position:sticky; top:0; z-index:20; background:var(--bg);
    padding:calc(10px + env(safe-area-inset-top,0px)) 0 10px; margin:0 0 8px;
    display:flex; gap:6px; flex-wrap:wrap; border-bottom:1px solid var(--border);
  }
  nav.secciones a{font-size:13.5px;text-decoration:none;color:var(--text-muted);padding:6px 12px;border-radius:999px;}
  nav.secciones a:hover{background:var(--teal-soft);color:var(--navy);}
  nav.secciones .act{margin-left:auto;font-size:12px;color:var(--text-muted);align-self:center;}

  /* Encabezado de obra */
  .obra-head{margin:26px 0 20px;}
  .obra-head h1{font-family:var(--display);font-weight:300;font-size:clamp(40px,7vw,64px);line-height:1;
    color:var(--navy);margin:0;letter-spacing:-.01em;}
  .obra-head .desc{color:var(--text-muted);font-size:14.5px;margin:10px 0 0;max-width:80ch;line-height:1.5;}
  .obra-head .meta{display:flex;flex-wrap:wrap;gap:6px 22px;margin-top:10px;font-size:13.5px;}
  .obra-head .meta span b{font-weight:700;}

  /* Línea de obra: la pieza central */
  .linea{background:var(--navy);color:#fff;border-radius:10px;padding:26px 28px 22px;
    box-shadow:0 4px 0 rgba(0,0,0,.16),0 6px 14px rgba(0,0,0,.10);}
  .linea .titular{display:grid;grid-template-columns:auto 1fr;gap:6px 28px;align-items:end;}
  .linea .pct{font-family:var(--display);font-weight:300;font-size:clamp(56px,9vw,88px);line-height:.9;}
  .linea .pct small{font-size:.42em;margin-left:4px;opacity:.85;}
  .linea .frase{font-size:16px;line-height:1.5;max-width:70ch;opacity:.95;}
  .linea .frase b{color:#fff;}
  .linea .frase .alerta{color:#ffc58a;font-weight:700;}
  .linea .graf{overflow-x:auto;margin-top:22px;}
  .linea svg{display:block;width:100%;min-width:860px;height:auto;overflow:visible;}
  @media (max-width:700px){.linea .titular{grid-template-columns:1fr;}}

  /* Indicadores */
  .kpis{display:grid;grid-template-columns:repeat(4,1fr);background:var(--panel);border:1px solid var(--border);
    border-radius:10px;margin:18px 0 0;}
  .kpi{padding:18px 20px;border-left:1px solid var(--border);}
  .kpi:first-child{border-left:none;}
  .kpi .l{font-size:13px;color:var(--text-muted);}
  .kpi .v{font-size:26px;font-weight:700;color:var(--navy);margin:4px 0 2px;}
  .kpi .s{font-size:12.5px;color:var(--text-muted);line-height:1.45;}
  .kpi .s b{color:var(--text);}
  @media (max-width:900px){.kpis{grid-template-columns:repeat(2,1fr);} .kpi:nth-child(3){border-left:none;}
    .kpi:nth-child(n+3){border-top:1px solid var(--border);}}
  @media (max-width:520px){.kpis{grid-template-columns:1fr;} .kpi{border-left:none;border-top:1px solid var(--border);} .kpi:first-child{border-top:none;}}

  /* Secciones */
  section{margin-top:44px;}
  h2{font-family:var(--display);font-weight:400;font-size:24px;color:var(--navy);margin:0 0 4px;}
  .bajada{color:var(--text-muted);font-size:14px;margin:0 0 18px;max-width:80ch;line-height:1.5;}
  .panel{background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:20px 22px;}
  .panel + .panel{margin-top:16px;}
  .panel h3{font-size:16px;margin:0 0 4px;color:var(--text);}
  .panel .nota{font-size:12.5px;color:var(--text-muted);margin:0 0 12px;line-height:1.45;}
  .dos{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
  .dos > .panel + .panel{margin-top:0;}
  .dos + .panel, .panel + .dos{margin-top:16px;}
  .dos > *, .globales > *{min-width:0;}
  tr.sep td{padding:0;border-bottom:2px solid var(--border);}
  @media (max-width:900px){.dos{grid-template-columns:1fr;}}

  .chart{width:100%;overflow-x:auto;}
  .chart svg{display:block;width:100%;min-width:400px;height:auto;}
  .chart.ancho svg{min-width:820px;}
  .leyenda{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:12.5px;color:var(--text-muted);margin-top:8px;}
  .leyenda i{display:inline-block;width:18px;height:0;border-top:3px solid;vertical-align:middle;margin-right:6px;}
  .leyenda i.dash{border-top-style:dashed;}
  .leyenda i.box{height:10px;border:none;width:12px;border-radius:2px;}

  /* Tablas */
  .tabla-wrap{overflow-x:auto;}
  table{width:100%;border-collapse:collapse;font-size:13.5px;}
  th{font-weight:700;text-align:left;color:var(--text-muted);font-size:12.5px;padding:8px 10px;border-bottom:2px solid var(--border);white-space:nowrap;}
  td{padding:8px 10px;border-bottom:1px solid var(--grid);vertical-align:middle;}
  td.n, th.n{text-align:right;white-space:nowrap;}
  tr.grupo td{background:var(--bg);font-weight:700;color:var(--navy2);font-size:12.5px;padding-top:10px;}
  .cod{color:var(--text-muted);white-space:nowrap;}
  .desc-item{max-width:46ch;}
  .barra{position:relative;height:10px;background:var(--grid);border-radius:5px;min-width:120px;}
  .barra span{position:absolute;left:0;top:0;bottom:0;background:var(--teal);border-radius:5px;}
  .barra.completo span{background:var(--navy);}
  .barra.excede span{background:var(--navy);}
  .barra.excede::after{content:"";position:absolute;right:-6px;top:-2px;width:12px;height:14px;background:var(--amber);border-radius:3px;}
  .pct-txt{font-weight:700;}
  .excede-txt{color:var(--amber);font-weight:700;}
  .filtro{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--text-muted);margin:0 0 10px;}
  .filtro input{accent-color:var(--navy);}

  /* Estaciones / ítems globales */
  .globales{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;}
  @media (max-width:900px){.globales{grid-template-columns:1fr;}}
  .global .tot{font-size:30px;font-weight:700;color:var(--navy);}
  .global h4{font-size:14px;margin:0 0 10px;line-height:1.35;font-weight:400;color:var(--text);}
  .disc{display:grid;grid-template-columns:110px 1fr 46px;gap:8px;align-items:center;font-size:13px;margin:8px 0;}
  .disc .peso{color:var(--text-muted);font-size:12px;}

  /* Circuito de cobro */
  .pend{display:grid;grid-template-columns:1.3fr 1fr 1.4fr 1fr;gap:10px 18px;align-items:center;padding:14px 0;border-bottom:1px solid var(--grid);}
  .pend:last-child{border-bottom:none;}
  .pend .nom{font-weight:700;}
  .pend .monto{font-size:18px;font-weight:700;color:var(--navy);}
  .pend .fecha{text-align:right;}
  .pend .fecha b{display:block;font-size:16px;color:var(--text);}
  .pend .fecha span{font-size:12px;color:var(--text-muted);}
  @media (max-width:700px){.pend{grid-template-columns:1fr 1fr;} .pend .fecha{text-align:left;}}
  .etapas{display:flex;align-items:center;gap:0;}
  .etapas .e{width:12px;height:12px;border-radius:50%;background:var(--grid);border:2px solid var(--border);flex:0 0 auto;}
  .etapas .e.hecha{background:var(--teal);border-color:var(--teal);}
  .etapas .e.actual{background:#fff;border-color:var(--navy);box-shadow:0 0 0 3px var(--teal-soft);}
  .etapas .t{height:2px;flex:1;background:var(--border);min-width:10px;}
  .etapas .t.hecha{background:var(--teal);}
  .etapa-txt{font-size:12.5px;color:var(--text-muted);margin-top:6px;}

  details{margin-top:16px;}
  details summary{cursor:pointer;font-size:14px;color:var(--navy);font-weight:700;}
  details[open] summary{margin-bottom:12px;}
  .avisos li{font-size:13px;margin:4px 0;color:var(--text);}

  footer{margin-top:40px;font-size:11.5px;color:var(--text-muted);border-top:1px solid var(--border);padding-top:16px;}

  .estado-msg{background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:28px;margin-top:30px;max-width:640px;}
  .estado-msg h2{margin-bottom:8px;}
  .estado-msg p{font-size:14px;line-height:1.55;color:var(--text-muted);}
  .estado-msg code{background:var(--bg);padding:2px 6px;border-radius:4px;color:var(--text);}

  @media (prefers-reduced-motion:no-preference){
    .linea .avance-fill{transition:width .9s ease-out;}
  }

  /* ===== Vistas, navegación y acciones ===== */
  [hidden]{display:none!important;}
  .marca{display:flex;align-items:center;gap:20px;text-decoration:none;color:inherit;border-radius:6px;}
  .marca:hover .area{text-decoration:underline;}
  nav.secciones .nav-acc{margin-left:auto;display:flex;gap:6px;flex-wrap:wrap;align-items:center;}
  .nav-btn{font:inherit;font-size:13.5px;background:#fff;border:1px solid var(--border);color:var(--navy);padding:6px 14px;border-radius:999px;cursor:pointer;}
  .nav-btn:hover{background:var(--teal-soft);}
  .nav-btn[aria-pressed="true"]{background:var(--navy);color:#fff;border-color:var(--navy);}
  .nav-btn.pdf{background:var(--navy);color:#fff;border-color:var(--navy);font-weight:700;}
  .nav-btn.pdf:hover{background:var(--navy2);}
  @media (max-width:600px){ .marca{gap:12px;} nav.secciones .nav-acc{margin-left:0;width:100%;} }
  .vista-titulo{margin:26px 0 18px;}
  .vista-titulo h1{font-family:var(--display);font-weight:300;font-size:clamp(30px,5vw,44px);line-height:1.05;color:var(--navy);margin:0;}
  .vista-titulo p{color:var(--text-muted);font-size:14px;margin:8px 0 0;max-width:80ch;line-height:1.5;}
  .solo-print{display:none;}

  /* ===== Consulta individual ===== */
  .consulta{display:grid;grid-template-columns:minmax(260px,340px) minmax(0,1fr);gap:16px;align-items:start;}
  @media (max-width:900px){.consulta{grid-template-columns:1fr;}}
  .cons-lista{position:sticky;top:64px;max-height:calc(100vh - 90px);overflow:auto;padding:14px;}
  @media (max-width:900px){.cons-lista{position:static;max-height:340px;}}
  .cons-lista input{width:100%;font:inherit;font-size:14px;padding:9px 12px;border:1px solid var(--border);border-radius:8px;margin-bottom:6px;background:#fff;color:var(--text);}
  .cons-g{font-size:12.5px;color:var(--text-muted);font-weight:700;margin:14px 0 4px;}
  .cons-it{display:grid;grid-template-columns:1fr auto;gap:1px 8px;width:100%;text-align:left;font:inherit;background:none;border:none;border-radius:6px;padding:7px 8px;cursor:pointer;color:var(--text);}
  .cons-it:hover{background:var(--bg);}
  .cons-it.sel{background:var(--teal-soft);}
  .cons-it .t{font-weight:700;font-size:13.5px;}
  .cons-it .s{grid-column:1;font-size:12px;color:var(--text-muted);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
  .cons-it .est{font-size:11.5px;color:var(--text-muted);align-self:center;grid-row:1/3;grid-column:2;text-align:right;max-width:110px;}
  .cons-it .est.abierto{color:var(--amber);font-weight:700;}
  .cons-vacio{font-size:13px;color:var(--text-muted);padding:10px 4px;line-height:1.5;}
  .ficha{padding:22px 24px;min-height:200px;}
  .ficha .f-tit{font-family:var(--display);font-weight:400;font-size:28px;color:var(--navy);margin:0;}
  .ficha .f-sub{color:var(--text-muted);font-size:14px;margin:4px 0 6px;line-height:1.45;}
  .f-cols{display:grid;grid-template-columns:1fr 1fr;gap:0 32px;}
  @media (max-width:760px){.f-cols{grid-template-columns:1fr;}}
  .f-sec h4{font-size:14px;margin:18px 0 6px;color:var(--navy2);}
  .f-fila{display:flex;justify-content:space-between;gap:16px;padding:7px 0;border-bottom:1px solid var(--grid);font-size:13.5px;align-items:baseline;}
  .f-fila > span:first-child{color:var(--text-muted);}
  .f-fila .v{font-weight:700;text-align:right;}
  .f-fila.total{border-bottom:2px solid var(--border);}
  .f-fila.total > span:first-child{color:var(--text);font-weight:700;}
  .f-fila .v.alerta{color:var(--amber);}
  .f-nota{font-size:12.5px;color:var(--text-muted);line-height:1.5;margin:8px 0 0;}
  .f-nota b{color:var(--text);}
  .chips{display:flex;flex-wrap:wrap;gap:6px;justify-content:flex-end;}
  .chip{font:inherit;font-size:12.5px;border:1px solid var(--border);background:#fff;color:var(--navy);border-radius:999px;padding:2px 10px;cursor:pointer;}
  .chip:hover{background:var(--teal-soft);}
  .f-pasos td.d{color:var(--text-muted);}
  .f-vacio{color:var(--text-muted);text-align:center;padding:70px 10px;font-size:14px;line-height:1.6;}
  .f-ancho{margin-top:6px;}
  .disc-ficha .disc{grid-template-columns:110px 1fr 46px;}

  /* ===== Definiciones ===== */
  .def-grupo{margin-bottom:16px;}
  .def-grupo h3{margin:0 0 4px;font-size:17px;color:var(--navy);}
  .def-item{padding:12px 0;border-bottom:1px solid var(--grid);}
  .def-item:last-child{border-bottom:none;padding-bottom:2px;}
  .def-term{font-weight:700;color:var(--navy);font-size:14.5px;}
  .def-desc{font-size:13.5px;color:var(--text);margin-top:3px;line-height:1.55;max-width:90ch;}
  .def-hoy{display:inline-block;background:var(--teal-soft);color:var(--navy);border-radius:10px;padding:1px 10px;font-size:12px;font-weight:600;margin-left:10px;}

  /* ===== Diálogo de exportación ===== */
  dialog#dlg-pdf{border:none;border-radius:12px;padding:24px 26px;max-width:500px;width:calc(100% - 32px);color:var(--text);font-family:var(--sans);box-shadow:0 12px 40px rgba(0,0,0,.28);}
  dialog#dlg-pdf::backdrop{background:rgba(10,30,45,.45);}
  dialog#dlg-pdf h3{margin:0 0 4px;font-family:var(--display);font-weight:400;font-size:24px;color:var(--navy);}
  dialog#dlg-pdf .nota{font-size:13px;color:var(--text-muted);line-height:1.5;margin:0 0 10px;}
  .pdf-op{display:flex;gap:10px;align-items:flex-start;padding:7px 0;font-size:14px;line-height:1.35;cursor:pointer;}
  .pdf-op input{margin-top:3px;accent-color:var(--navy);}
  .pdf-op small{display:block;color:var(--text-muted);font-size:12.5px;margin-top:1px;}
  .dlg-acc{display:flex;gap:10px;justify-content:flex-end;margin-top:18px;}
  .btn{font:inherit;font-size:14px;border-radius:8px;padding:8px 18px;cursor:pointer;border:1px solid var(--border);background:#fff;color:var(--navy);}
  .btn.prim{background:var(--navy);border-color:var(--navy);color:#fff;font-weight:700;}
  .btn.prim:hover{background:var(--navy2);}

  /* ===== Impresión / PDF (A4 vertical) ===== */
  @media print{
    @page{size:A4 portrait;margin:12mm 11mm;}
    *{-webkit-print-color-adjust:exact;print-color-adjust:exact;}
    body{background:#fff;padding:0;}
    .wrap{max-width:none;}
    nav.secciones,.volver,footer,.filtro,dialog,.no-print,#vista-consulta,#vista-def{display:none!important;}
    .pdf-oculto{display:none!important;}
    header{padding-bottom:10px;border-bottom-width:2px;}
    header img{height:50px;}
    .marca{pointer-events:none;}
    .solo-print{display:block;}
    .emision{font-size:12px;color:var(--text-muted);margin:10px 0 0;}
    .cierre{margin-top:26px;padding-top:10px;border-top:1px solid var(--border);font-size:11px;color:var(--text-muted);line-height:1.5;}
    .obra-head{margin:12px 0 14px;}
    .obra-head h1{font-size:42px;}
    .linea{box-shadow:none;padding:20px 22px 16px;break-inside:avoid;}
    .linea .graf{overflow:visible;}
    .linea svg,.chart svg,.chart.ancho svg{min-width:0!important;}
    .chart{overflow:visible;}
    .kpis{break-inside:avoid;}
    section{margin-top:24px;}
    h2,h3{break-after:avoid;}
    .panel{break-inside:avoid;box-shadow:none;}
    .panel[data-pdf="items"],.panel[data-pdf="historial"]{break-inside:auto;}
    tr{break-inside:avoid;}
    .tabla-wrap{overflow:visible;}
    table{font-size:10.5px;}
    .globales{gap:10px;}
    details > summary{display:none;}
    details[open]{margin-top:0;}
    section > h2,section > .bajada,.panel > h3,.panel > .nota,.solo-print.sub{break-after:avoid;}
    .solo-print.sub{font-size:13px;font-weight:700;color:var(--navy2);margin:14px 0 6px;}
    .linea svg text{font-size:15px;}
    thead{display:table-header-group;}
    #avance,#valores,#proyeccion{break-before:page;}
    #g-escalera svg,#g-cobro svg{max-width:520px;margin:0 auto;}
    td,th{padding:3px 6px;}
    .desc-item{max-width:none;}
    .globales{grid-template-columns:repeat(3,1fr);gap:12px;}
    .global .tot{font-size:24px;}
    .global h4{font-size:12px;}
    .globales .disc{grid-template-columns:92px minmax(0,1fr) 36px;font-size:11.5px;gap:6px;}
    .globales .barra{min-width:0;}
  }

  .consulta > .panel + .panel{margin-top:0;}

  /* ===== Índice general de certificaciones ===== */
  .ix-filtros-activos{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0 0;}
  .ix-pill{font:inherit;font-size:13px;border:1px solid var(--navy);background:var(--teal-soft);color:var(--navy);border-radius:999px;padding:3px 12px;cursor:pointer;}
  .ix-pill:hover{background:#cfeef2;}
  .ix-main{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:16px;align-items:start;}
  @media (max-width:1000px){.ix-main{grid-template-columns:1fr;}}
  .ix-main > .panel + .panel{margin-top:0;}

  .cal-bar{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;justify-content:space-between;margin-bottom:12px;}
  .cal-nav{display:flex;align-items:center;gap:8px;}
  .cal-nav h3{margin:0;min-width:160px;text-align:center;font-family:var(--display);font-weight:400;font-size:24px;color:var(--navy);text-transform:capitalize;}
  .cal-nav .flecha{font:inherit;font-size:20px;line-height:1;width:34px;height:34px;border:1px solid var(--border);background:#fff;color:var(--navy);border-radius:999px;cursor:pointer;}
  .cal-nav .flecha:hover{background:var(--teal-soft);}
  .seg{display:inline-flex;border:1px solid var(--border);border-radius:999px;overflow:hidden;background:#fff;}
  .seg button{font:inherit;font-size:13px;border:none;background:none;padding:7px 16px;cursor:pointer;color:var(--navy);}
  .seg button[aria-pressed="true"]{background:var(--navy);color:#fff;}
  .cal-filtros{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px;}
  .cal-filtros select,.cal-filtros input{font:inherit;font-size:13.5px;padding:7px 10px;border:1px solid var(--border);border-radius:8px;background:#fff;color:var(--text);min-width:0;max-width:100%;}
  .cal-filtros input{flex:1 1 200px;}
  .cal-sem,.cal-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));}
  .cal-sem div{font-size:12px;color:var(--text-muted);text-align:center;padding:4px 0;}
  .cal-grid{gap:1px;background:var(--border);border:1px solid var(--border);border-radius:8px;overflow:hidden;}
  .dia{background:#fff;min-height:118px;padding:4px 5px 5px;display:flex;flex-direction:column;gap:3px;min-width:0;}
  .dia.fuera{background:var(--bg);}
  .dia .dn{align-self:flex-start;font:inherit;font-size:12px;color:var(--text-muted);background:none;border:none;padding:1px 7px;border-radius:999px;cursor:pointer;}
  .dia .dn:hover{background:var(--teal-soft);}
  .dia.hoy .dn{background:var(--navy);color:#fff;font-weight:700;}
  .evs{display:flex;flex-direction:column;gap:3px;min-width:0;}
  .ev{display:block;width:100%;text-align:left;font:inherit;font-size:11px;line-height:1.3;border:1px solid transparent;border-radius:5px;padding:2px 6px;cursor:pointer;overflow:hidden;min-width:0;}
  .ev .tx{display:block;}
  .ev .nm{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .ev:hover{filter:brightness(.96);}
  .ev b{font-weight:700;}
  .ev-acta{background:#fdf3c7;color:#5e4a00;border-color:#ecd77b;}
  .ev-envio{background:#fde4cc;color:#7a3d00;border-color:#f3c597;}
  .ev-entrada{background:#d9edfb;color:#0b4c7b;border-color:#a9d3f0;}
  .ev-tesoreria{background:#e8defa;color:#4a2f86;border-color:#cdbbef;}
  .ev-pago{background:#d5f0e0;color:#1b6a41;border-color:#a6dcc0;}
  .ev.est{background:#fff;border:1px dashed #2e9e62;color:#1b6a41;}
  .ev.est.atrasado{border-color:var(--amber);color:#9a5a12;}
  .ev.dem{box-shadow:inset 3px 0 0 var(--amber);}
  .mas{font:inherit;font-size:11.5px;color:var(--navy);background:none;border:none;text-align:left;padding:1px 4px;cursor:pointer;}
  .mas:hover{text-decoration:underline;}
  .cal-vacio{font-size:13px;color:var(--text-muted);margin:10px 2px 0;line-height:1.5;}
  .cal-leyenda{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:12.5px;color:var(--text-muted);margin-top:12px;}
  .cal-leyenda span{display:inline-flex;align-items:center;gap:6px;}
  .cal-leyenda i{display:inline-block;width:14px;height:12px;border-radius:3px;border:1px solid transparent;}
  .cal-leyenda i.est{background:#fff;border:1px dashed #2e9e62;}
  .cal-leyenda i.dem{background:#fff;border:1px solid var(--border);box-shadow:inset 3px 0 0 var(--amber);}
  @media (max-width:700px){
    .dia{min-height:56px;padding:2px;}
    .evs{flex-direction:row;flex-wrap:wrap;gap:2px;}
    .ev{width:9px;height:9px;padding:0;border-radius:50%;pointer-events:none;}
    .ev .tx{display:none;}
    .mas{display:none;}
    .cal-nav h3{min-width:120px;font-size:20px;}
  }

  .mover h3{margin:0 0 2px;font-size:17px;color:var(--navy);}
  .mv-g{margin-top:16px;}
  .mv-g h4{margin:0;font-size:14px;color:var(--navy2);}
  .mv-g .sub{font-size:12px;color:var(--text-muted);margin:1px 0 6px;line-height:1.4;}
  .mv{display:block;width:100%;text-align:left;font:inherit;background:none;border:none;border-bottom:1px solid var(--grid);padding:8px 4px;cursor:pointer;color:var(--text);}
  .mv:hover{background:var(--bg);}
  .mv .t{display:block;font-size:13.5px;font-weight:700;}
  .mv .s{display:block;font-size:12px;color:var(--text-muted);margin-top:1px;line-height:1.4;}
  .mv .tag{display:inline-block;font-size:11px;font-weight:700;color:#9a5a12;background:var(--amber-soft);border-radius:999px;padding:0 8px;margin-left:6px;}
  .mv-vacio{font-size:13px;color:var(--text-muted);padding:8px 4px;}
  .mover details{margin-top:16px;}

  .obras-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px;}
  .obra-card{background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:14px 16px;display:flex;flex-direction:column;gap:10px;min-width:0;}
  .obra-card.sel{border-color:var(--navy);box-shadow:0 0 0 2px var(--teal-soft);}
  .obra-card h3{margin:0;font-size:16px;color:var(--navy);}
  .obra-card .emp{font-size:12px;color:var(--text-muted);line-height:1.4;}
  .oc-nums{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .oc-nums .l{display:block;font-size:12px;color:var(--text-muted);}
  .oc-nums b{display:block;font-size:18px;color:var(--navy);margin:1px 0;}
  .oc-nums .s{font-size:12px;color:var(--text-muted);}
  .oc-pie{font-size:12.5px;color:var(--text-muted);display:flex;flex-wrap:wrap;gap:4px 10px;align-items:center;}
  .oc-pie .tag{font-size:11px;font-weight:700;color:#9a5a12;background:var(--amber-soft);border-radius:999px;padding:0 8px;}
  .oc-acc{display:flex;gap:8px;align-items:center;margin-top:auto;flex-wrap:wrap;}
  .oc-acc .btn{font-size:13px;padding:5px 12px;text-decoration:none;display:inline-block;}
  .oc-acc .sin{font-size:12.5px;color:var(--text-muted);}

  .ix-datos h4{font-size:14px;margin:16px 0 4px;color:var(--navy2);}
  .ix-datos li{font-size:13px;margin:3px 0;line-height:1.45;}
  .ix-datos .fila{color:var(--text-muted);}
  .ix-como li{font-size:13.5px;margin:6px 0;line-height:1.5;}

  dialog.ix-dlg{border:none;border-radius:12px;padding:22px 24px;max-width:680px;width:calc(100% - 28px);max-height:calc(100vh - 40px);overflow:auto;color:var(--text);font-family:var(--sans);box-shadow:0 12px 40px rgba(0,0,0,.28);}
  dialog.ix-dlg::backdrop{background:rgba(10,30,45,.45);}
  .ix-dlg .cerrar{float:right;font:inherit;font-size:13px;border:1px solid var(--border);background:#fff;color:var(--navy);border-radius:999px;padding:4px 14px;cursor:pointer;}
  .ix-dlg .cerrar:hover{background:var(--teal-soft);}
  .ix-dlg .f-tit{font-size:24px;}
  .dia-lista .mv{padding:9px 4px;}
  .dia-lista .pto{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:8px;border:1px solid transparent;}

<script>
/* ============================================================
   Panel de certificaciones de una obra.
   Lee data/certificaciones_<obra>.json (lo genera actualizar_certificaciones.py)
   La obra viene en la URL: certificaciones.html?obra=mechita
   ============================================================ */
const MESES = ["ene","feb","mar","abr","may","jun","jul","ago","sep","oct","nov","dic"];
const ROM = ["","I","II","III","IV","V","VI","VII","VIII","IX","X","XI","XII","XIII","XIV","XV"];

const fmtNum = (v, d=1) => v == null ? "—" : v.toLocaleString("es-AR", {minimumFractionDigits:d, maximumFractionDigits:d});
const fmtM = v => v == null ? "—" : "$ " + fmtNum(v/1e6, 1) + " M";
const fmtPct = (v, d=1) => v == null ? "—" : fmtNum(v*100, d) + " %";
const fmtCant = v => v == null ? "—" : v.toLocaleString("es-AR", {maximumFractionDigits: v % 1 ? 2 : 0});
function parseISO(s){ if(!s) return null; const [y,m,d] = s.split("-").map(Number); return new Date(y, m-1, d||1); }
const fmtFecha = s => { const d = parseISO(s); return d ? d.toLocaleDateString("es-AR",{day:"2-digit",month:"2-digit",year:"numeric"}) : "—"; };
const fmtMes = s => { const d = parseISO(s); return d ? MESES[d.getMonth()] + "-" + String(d.getFullYear()).slice(2) : "—"; };
const mesIdx = s => { const d = parseISO(s); return d.getFullYear()*12 + d.getMonth(); };
const idxMes = i => `${Math.floor(i/12)}-${String(i%12+1).padStart(2,"0")}`;
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

const NS = "http://www.w3.org/2000/svg";
function svg(w, h, cls){ const s = document.createElementNS(NS,"svg"); s.setAttribute("viewBox",`0 0 ${w} ${h}`); if(cls) s.setAttribute("class",cls); return s; }
function el(parent, tag, attrs={}, text){
  const e = document.createElementNS(NS, tag);
  for(const k in attrs) e.setAttribute(k, attrs[k]);
  if(text != null) e.textContent = text;
  parent.appendChild(e); return e;
}
function tip(e, text){ el(e, "title", {}, text); return e; }
function niceMax(v){ const p = Math.pow(10, Math.floor(Math.log10(v))); for(const m of [1,1.2,1.5,2,2.5,3,4,5,6,8,10]) if(m*p >= v) return m*p; return 10*p; }

const C = { navy:"#005895", navy2:"#0b4c7b", teal:"#00aec3", bright:"#008ed7", grid:"#e9f0f5", border:"#dbe6ee",

function kpis(d){
  const o = d.obra, k = d.kpis;
  const inc = o.montoContrato ? o.montoVigente/o.montoContrato - 1 : null;
  const prox = d.tramites.filter(t => t.estado !== "Pagado" && t.pagoEstimado).sort((a,b) => a.pagoEstimado.localeCompare(b.pagoEstimado))[0];
  return `
    <div class="kpi"><div class="l">Monto vigente</div><div class="v">${fmtM(o.montoVigente)}</div>
      <div class="s">Contrato original ${fmtM(o.montoContrato)}, <b>+${fmtPct(inc)}</b> por ${o.redetVigente} redeterminaciones</div></div>
    <div class="kpi"><div class="l">Certificado a la fecha</div><div class="v">${fmtM(k.certificadoPreciosVigentes)}</div>
      <div class="s">A precios redeterminados, ajustes incluidos. Último: certificado ${k.ultimoCert} del ${fmtFecha(k.ultimoCertFecha)}</div></div>
    <div class="kpi"><div class="l">Pagado</div><div class="v">${fmtM(k.pagado)}</div>
      <div class="s">${fmtPct(k.netoCertificado ? k.pagado/k.netoCertificado : null)} del neto certificado, anticipos incluidos</div></div>
    <div class="kpi"><div class="l">En trámite de pago</div><div class="v">${fmtM(k.porCobrar)}</div>
      <div class="s">${prox ? `Próximo: <b>${esc(prox.nombre)}</b>, estimado ${fmtFecha(prox.pagoEstimado)}` : "Sin pagos pendientes"}</div></div>`;
}

/* ---------------- línea de obra (pieza principal) ---------------- */
function lineaObra(d){
  const o = d.obra, k = d.kpis, p = d.proyeccion;
  const box = document.getElementById("linea");
  const atraso = p.finPlanVigente && p.finEstimadoRitmo && p.finEstimadoRitmo > p.finPlanVigente;
  let frase = `Certificado ${k.ultimoCert}, trabajos de ${fmtMes(p.ultimoMes+"-01")}. Falta certificar el <b>${fmtPct(p.saldoPct)}</b>.`;
  if(p.ritmoNecesario){
    frase += ` Para terminar en ${fmtMes(p.finPlanVigente)}, como indica el plan vigente del seguimiento, hacen falta <b>${fmtPct(p.ritmoNecesario)} por mes</b>;
      el ritmo de los últimos tres certificados es <b>${fmtPct(p.ritmoReciente)}</b>`;
    frase += p.finEstimadoRitmo ? `, que llevaría el final a <span class="${atraso ? "alerta" : ""}">${fmtMes(p.finEstimadoRitmo)}</span>.` : ".";
  }
  box.innerHTML = `<div class="titular"><div class="pct">${fmtNum((k.pctAvance||0)*100,1)}<small>%</small></div>
    <div class="frase">${frase}</div></div>`;

  // eje temporal: contrato -> mayor de las fechas de fin
  const ini = parseISO(o.fechaContrato);
  const fechas = [p.finContractual, p.finPlanVigente, p.finEstimadoRitmo].filter(Boolean).map(parseISO);
  const hoy = new Date();
  const fin = new Date(Math.max(...fechas.map(f => f.getTime()), hoy.getTime()) + 45*864e5);
  const W = 1000, H = 190, x0 = 8, x1 = W - 8;
  const X = f => x0 + (f - ini) / (fin - ini) * (x1 - x0);
  const s = svg(W, H);
  const yBar = 80;
  el(s, "rect", {x:x0, y:yBar, width:x1-x0, height:10, rx:5, fill:"rgba(255,255,255,.16)"});
  // tiempo transcurrido
  el(s, "rect", {x:x0, y:yBar, width:Math.max(0, X(hoy)-x0), height:10, rx:5, fill:"rgba(255,255,255,.35)"});
  // avance (proporcional al plazo contractual, para leer avance vs tiempo)
  const fc = parseISO(p.finContractual);
  if(fc){
    const wAv = (X(fc) - x0) * (k.pctAvance||0);
    tip(el(s, "rect", {x:x0, y:yBar+14, width:wAv, height:6, rx:3, fill:C.teal}),
      `Avance certificado ${fmtPct(k.pctAvance)} sobre el plazo contractual`);
    el(s, "text", {x:x0, y:yBar+36, fill:"#bfe9f0", "font-size":13}, `Barra celeste: avance ${fmtPct(k.pctAvance)} a escala del plazo contractual`);
  }
  // marcas
  const marcas = [
    {f:ini, t:"Contrato", s:fmtMes(o.fechaContrato), arriba:true},
    {f:fc, t:"Fin contractual", s:fmtMes(p.finContractual), arriba:true},
    {f:parseISO(p.finPlanVigente), t:"Fin vigente", s:fmtMes(p.finPlanVigente), arriba:false},
    {f:parseISO(p.finEstimadoRitmo), t:"Al ritmo actual", s:fmtMes(p.finEstimadoRitmo), arriba:true, alerta:true},
    {f:hoy, t:"Hoy", s:"", arriba:false, hoy:true},
  ].filter(m => m.f);
  // ubicación de etiquetas: arriba o abajo de la barra, en dos niveles, sin pisarse
  const ocupado = {arriba:[[],[]], abajo:[[],[]]};
  const libre = (lado, nivel, x) => ocupado[lado][nivel].every(v => Math.abs(v - x) > 120);
  for(const m of marcas.sort((a,b) => a.f - b.f)){
    const x = X(m.f);
    const pref = m.arriba ? "arriba" : "abajo", otro = m.arriba ? "abajo" : "arriba";
    let lado = pref, nivel = 0;
    if(!libre(pref,0,x)){ if(libre(otro,0,x)) lado = otro; else if(libre(pref,1,x)) nivel = 1; else { lado = otro; nivel = 1; } }
    ocupado[lado][nivel].push(x);
    const color = m.alerta ? "#ffc58a" : "#fff";
    const yTit = lado === "arriba" ? yBar - 26 - nivel*34 : yBar + 56 + nivel*34;
    el(s, "line", {x1:x, x2:x, y1:lado === "arriba" ? yBar - 8 - nivel*34 : yBar, y2:lado === "arriba" ? yBar + 18 : yBar + 40 + nivel*34,
      stroke:color, "stroke-width":m.hoy?2:1.5, "stroke-dasharray":m.hoy?"":"3 3", opacity:.9});
    const anchor = x < 80 ? "start" : (x > W-80 ? "end" : "middle");
    el(s, "text", {x, y:yTit, fill:color, "font-size":13, "font-weight":700, "text-anchor":anchor}, m.t);
    if(m.s) el(s, "text", {x, y:yTit+14, fill:color, "font-size":12.5, "text-anchor":anchor, opacity:.85}, m.s);
  }
  const yMin = ocupado.arriba[1].length ? yBar - 74 : yBar - 42;
  const yMax = ocupado.abajo[1].length ? yBar + 110 : (ocupado.abajo[0].length ? yBar + 78 : yBar + 46);
  s.setAttribute("viewBox", `0 ${yMin} ${W} ${yMax - yMin}`);
  s.setAttribute("role","img");
  s.setAttribute("aria-label","Línea de tiempo de la obra: contrato, fin contractual, fin vigente y fin estimado al ritmo actual");
  const graf = document.createElement("div"); graf.className = "graf";
  graf.appendChild(s); box.appendChild(graf);
}

/* ---------------- curva S ---------------- */
function curva(d){
  const real = d.curva.real, plan = d.curva.plan || d.curva.planOriginal, p = d.proyeccion;
  const orig = d.curva.plan ? (d.curva.planOriginal || []) : [];
  const meses = [...real.map(r => r.mes), ...plan.map(r => r.mes), ...orig.map(r => r.mes)];
  if(p.finPlanVigente) meses.push(p.finPlanVigente.slice(0,7));
  if(p.finEstimadoRitmo) meses.push(p.finEstimadoRitmo.slice(0,7));
  const i0 = Math.min(...meses.map(m => mesIdx(m+"-01"))), i1 = Math.max(...meses.map(m => mesIdx(m+"-01")));
  const W = 1000, H = 330, L = 48, R = 16, T = 14, B = 34;
  const X = i => L + (i - i0) / Math.max(1, i1 - i0) * (W - L - R);
  const Y = v => T + (1 - v) * (H - T - B);
  const s = svg(W, H);
  for(let v = 0; v <= 1.0001; v += .25){
    el(s, "line", {x1:L, x2:W-R, y1:Y(v), y2:Y(v), stroke:C.grid});
    el(s, "text", {x:L-8, y:Y(v)+4, "text-anchor":"end", "font-size":12, fill:C.muted}, Math.round(v*100)+" %");
  }
  const paso = (i1 - i0) > 18 ? 3 : 2;
  for(let i = i0; i <= i1; i++){
    if((i - i0) % paso) continue;
    el(s, "text", {x:X(i), y:H-12, "text-anchor":"middle", "font-size":12, fill:C.muted}, fmtMes(idxMes(i)+"-01"));
  }
  const linea = (pts, attrs) => el(s, "polyline", {points:pts.map(([x,y]) => `${x},${y}`).join(" "), fill:"none", ...attrs});
  if(orig.length) linea(orig.map(r => [X(mesIdx(r.mes+"-01")), Y(r.pctAcum)]), {stroke:C.orig, "stroke-width":2});
  if(plan.length) linea(plan.map(r => [X(mesIdx(r.mes+"-01")), Y(r.pctAcum)]), {stroke:C.plan, "stroke-width":2.5, "stroke-dasharray":"6 5"});
  // proyecciones desde el último punto real
  const ult = real[real.length-1], iu = mesIdx(ult.mes+"-01");
  if(p.finEstimadoRitmo) linea([[X(iu), Y(ult.pctAcum)], [X(mesIdx(p.finEstimadoRitmo)), Y(1)]], {stroke:C.amber, "stroke-width":2, "stroke-dasharray":"5 5"});
  if(p.finPlanVigente) linea([[X(iu), Y(ult.pctAcum)], [X(mesIdx(p.finPlanVigente)), Y(1)]], {stroke:C.navy2, "stroke-width":2, "stroke-dasharray":"2 4", opacity:.5});
  linea(real.map(r => [X(mesIdx(r.mes+"-01")), Y(r.pctAcum)]), {stroke:C.teal, "stroke-width":3});
  for(const r of real){
    tip(el(s, "circle", {cx:X(mesIdx(r.mes+"-01")), cy:Y(r.pctAcum), r:4, fill:"#fff", stroke:C.teal, "stroke-width":2}),
      `Certificado ${r.n} (${fmtMes(r.mes+"-01")}): ${fmtPct(r.pct)} en el mes, ${fmtPct(r.pctAcum)} acumulado`);
  }
  el(s, "text", {x:X(iu)+8, y:Y(ult.pctAcum)+16, "font-size":13, "font-weight":700, fill:C.navy}, fmtPct(ult.pctAcum));
  document.getElementById("g-curva").appendChild(s);
}

/* ---------------- tabla de ítems ---------------- */
function itemsTabla(d){
  const t = document.getElementById("t-items");
  const filtro = document.getElementById("solo-pend");
  function dibujar(){
    const solo = filtro.checked;
    let html = `<thead><tr><th>Ítem</th><th>Descripción</th><th class="n">Contrato</th><th class="n">Ejecutado</th><th>Avance</th><th class="n">%</th><th class="n">Saldo</th></tr></thead><tbody>`;
    let grupoActual = null;
    for(const i of d.items){
      if(solo && (i.saldoCant ?? 0) <= 0) continue;
      if(i.grupo && i.grupo !== grupoActual){ html += `<tr class="grupo"><td colspan="7">${esc(i.grupo)}</td></tr>`; }
      else if(!i.grupo && grupoActual){ html += `<tr class="sep"><td colspan="7"></td></tr>`; }
      grupoActual = i.grupo;
      const pct = i.pctAcum ?? 0;
      const cls = pct > 1.0001 ? "excede" : (pct >= .9999 ? "completo" : "");
      const saldo = i.saldoMonto < 0
        ? `<span class="excede-txt" title="Se ejecutó más que la cantidad de contrato">excedido ${fmtCant(-i.saldoCant)} ${esc(i.unidad)}</span>`
        : fmtM(i.saldoMonto);
      html += `<tr><td class="cod">${esc(i.codigo)}</td><td class="desc-item">${esc(i.descripcion)}</td>
        <td class="n">${fmtCant(i.cantidad)} ${esc(i.unidad)}</td><td class="n">${fmtCant(i.cantAcum)}</td>
        <td><div class="barra ${cls}" title="${fmtPct(pct)}"><span style="width:${Math.min(100,pct*100)}%"></span></div></td>
        <td class="n ${pct > 1.0001 ? "excede-txt" : "pct-txt"}">${fmtNum(pct*100,0)}%</td><td class="n">${saldo}</td></tr>`;
    }
    t.innerHTML = html + "</tbody>";
  }
  filtro.addEventListener("change", dibujar);
  dibujar();
}

/* ---------------- escalera de redeterminaciones ---------------- */
function escalera(d){
  const r = d.redeterminaciones.filter(x => x.monto);
  const hoy = new Date();
  const W = 520, H = 300, L = 56, R = 70, T = 20, B = 30;
  const ini = parseISO(r[0].mesSalto), fin = hoy;
  const X = f => L + (f - ini) / (fin - ini) * (W - L - R);
  const span = r[r.length-1].monto - r[0].monto || r[0].monto*.1;
  const vmin = r[0].monto - span*.15, vmax = r[r.length-1].monto + span*.2;
  const Y = v => T + (1 - (v - vmin)/(vmax - vmin)) * (H - T - B);
  const s = svg(W, H);
  for(let i = 0; i <= 4; i++){
    const v = vmin + (vmax - vmin) * i/4;
    el(s, "line", {x1:L, x2:W-R, y1:Y(v), y2:Y(v), stroke:C.grid});
    el(s, "text", {x:L-8, y:Y(v)+4, "text-anchor":"end", "font-size":12, fill:C.muted}, fmtNum(v/1e9, 2)+" MM");
  }
  let pts = [];
  r.forEach((x, i) => {
    const f = parseISO(x.mesSalto), xn = X(f);
    if(i) pts.push([xn, Y(r[i-1].monto)]);
    pts.push([xn, Y(x.monto)]);
  });
  pts.push([X(fin), Y(r[r.length-1].monto)]);
  el(s, "polygon", {points:[[L, Y(vmin)], ...pts, [X(fin), Y(vmin)]].map(p => p.join(",")).join(" "), fill:"#e3f6f8"});
  el(s, "polyline", {points:pts.map(p => p.join(",")).join(" "), fill:"none", stroke:C.navy, "stroke-width":2.5});
  r.forEach((x, i) => {
    const xn = X(parseISO(x.mesSalto));
    const inc = i ? x.monto / r[i-1].monto - 1 : null;
    const g = tip(el(s, "g"), i ? `Redet. ${ROM[x.redet]} — salto ${fmtMes(x.mesSalto)}: ${fmtM(x.monto)} (+${fmtPct(inc)}). Se aplicó desde el certificado ${x.primerCert ?? "—"}.`
                                 : `Contrato original: ${fmtM(x.monto)}`);
    el(g, "circle", {cx:xn, cy:Y(x.monto), r:4, fill:"#fff", stroke:C.navy, "stroke-width":2});
    if(i) el(g, "text", {x:xn+4, y:Y(x.monto)-8, "font-size":12, "font-weight":700, fill:C.navy2}, ROM[x.redet]);
  });
  const last = r[r.length-1];
  el(s, "text", {x:W-R+6, y:Y(last.monto)+4, "font-size":13, "font-weight":700, fill:C.navy}, fmtNum(last.monto/1e9,2)+" MM");
  el(s, "text", {x:L, y:H-8, "font-size":12, fill:C.muted}, fmtMes(r[0].mesSalto));
  el(s, "text", {x:X(fin), y:H-8, "font-size":12, fill:C.muted, "text-anchor":"end"}, "hoy");
  const box = document.getElementById("g-escalera"); box.appendChild(s);
  
}

/* ---------------- certificado vs cobrado ---------------- */
function cobro(d){
  // neto certificado por fecha de certificado; pagado por fecha de pago
  const eventosCert = [], eventosPago = [];
  for(const t of d.tramites){
    if(t.fechaCert && t.monto != null) eventosCert.push([parseISO(t.fechaCert), t.monto]);
    if(t.pago && t.monto != null) eventosPago.push([parseISO(t.pago), t.monto]);
  }
  if(!eventosCert.length) return;
  eventosCert.sort((a,b) => a[0]-b[0]); eventosPago.sort((a,b) => a[0]-b[0]);
  const acum = ev => { let s = 0; return ev.map(([f,v]) => [f, s += v]); };
  const ac = acum(eventosCert), ap = acum(eventosPago);
  const ini = ac[0][0], fin = new Date();
  const W = 520, H = 300, L = 56, R = 70, T = 20, B = 30;
  const vmax = niceMax(Math.max(ac[ac.length-1][1], ap.length ? ap[ap.length-1][1] : 0)/1e9)*1e9;
  const X = f => L + (f - ini) / (fin - ini) * (W - L - R);
  const Y = v => T + (1 - v/vmax) * (H - T - B);
  const s = svg(W, H);
  for(let i = 0; i <= 4; i++){
    const v = vmax*i/4;
    el(s, "line", {x1:L, x2:W-R, y1:Y(v), y2:Y(v), stroke:C.grid});
    el(s, "text", {x:L-8, y:Y(v)+4, "text-anchor":"end", "font-size":12, fill:C.muted}, fmtNum(v/1e9,1)+" MM");
  }
  const escalones = serie => { const pts = [[X(ini), Y(0)]]; let prev = 0;
    for(const [f,v] of serie){ pts.push([X(f), Y(prev)], [X(f), Y(v)]); prev = v; }
    pts.push([X(fin), Y(prev)]); return pts; };
  el(s, "polyline", {points:escalones(ac).map(p=>p.join(",")).join(" "), fill:"none", stroke:C.navy, "stroke-width":2.5});
  if(ap.length) el(s, "polyline", {points:escalones(ap).map(p=>p.join(",")).join(" "), fill:"none", stroke:C.teal, "stroke-width":2.5});
  const uc = ac[ac.length-1][1], up = ap.length ? ap[ap.length-1][1] : 0;
  el(s, "text", {x:W-R+6, y:Y(uc)-2, "font-size":12.5, "font-weight":700, fill:C.navy}, fmtNum(uc/1e9,2)+" MM");
  el(s, "text", {x:W-R+6, y:Y(up)+14, "font-size":12.5, "font-weight":700, fill:C.teal}, fmtNum(up/1e9,2)+" MM");
  el(s, "text", {x:L, y:H-8, "font-size":12, fill:C.muted}, fmtMes(ac[0][0].toISOString().slice(0,10)));
  el(s, "text", {x:X(fin), y:H-8, "font-size":12, fill:C.muted, "text-anchor":"end"}, "hoy");
  document.getElementById("g-cobro").appendChild(s);
  
}

/* ---------------- certificación mensual ---------------- */
function mensual(d){
  const c = d.certificados;
  const W = 1000, H = 280, L = 56, R = 10, T = 14, B = 40;
  const vmax = niceMax(Math.max(...c.map(x => (x.base||0) + Math.max(0, x.difRedet||0)))/1e6)*1e6;
  const bw = (W - L - R) / c.length;
  const Y = v => T + (1 - v/vmax) * (H - T - B);
  const s = svg(W, H);
  for(let i = 0; i <= 4; i++){
    const v = vmax*i/4;
    el(s, "line", {x1:L, x2:W-R, y1:Y(v), y2:Y(v), stroke:C.grid});
    el(s, "text", {x:L-8, y:Y(v)+4, "text-anchor":"end", "font-size":12, fill:C.muted}, fmtNum(v/1e6,0)+" M");
  }
  c.forEach((x, i) => {
    const x0 = L + i*bw + bw*.18, w = bw*.64;
    const g = tip(el(s, "g"), `Certificado ${x.n} — ${fmtMes(x.mes+"-01")}\nA precios de contrato: ${fmtM(x.base)}\nDiferencia por redeterminación: ${fmtM(x.difRedet)}\nTotal: ${fmtM(x.conRedet)}. Neto a pagar: ${fmtM(x.neto)}`);
    el(g, "rect", {x:x0, y:Y(x.base), width:w, height:Y(0)-Y(x.base), fill:C.navy, rx:2});
    if(x.difRedet > 0) el(g, "rect", {x:x0, y:Y(x.base + x.difRedet), width:w, height:Y(0)-Y(x.difRedet), fill:C.teal, rx:2});
    el(s, "text", {x:x0+w/2, y:H-22, "text-anchor":"middle", "font-size":12, fill:C.text}, x.n);
    el(s, "text", {x:x0+w/2, y:H-6, "text-anchor":"middle", "font-size":11, fill:C.muted}, fmtMes(x.mes+"-01"));
  });
  document.getElementById("g-mensual").appendChild(s);
}

/* ---------------- dónde está el saldo ---------------- */
function saldo(d){
  const items = d.items.filter(i => (i.saldoMonto||0) > 0).sort((a,b) => b.saldoMonto - a.saldoMonto);
  const top = items.slice(0, 8), resto = items.slice(8).reduce((s,i) => s + i.saldoMonto, 0);
  const filas = top.map(i => ({t:`${i.codigo}  ${i.descripcion}`, v:i.saldoMonto}));
  if(resto > 0) filas.push({t:`Otros ${items.length-8} ítems`, v:resto});
  const W = 520, fila = 34, L = 0, H = filas.length*fila + 8;
  const vmax = Math.max(...filas.map(f => f.v));
  const s = svg(W, H);
  filas.forEach((f, i) => {
    const y = i*fila + 4;
    const txt = f.t.length > 62 ? f.t.slice(0,61) + "…" : f.t;
    el(s, "text", {x:L, y:y+11, "font-size":12.5, fill:C.text}, txt);
    tip(el(s, "rect", {x:L, y:y+16, width:Math.max(2,(W-110)*f.v/vmax), height:9, rx:3, fill:i < top.length ? C.bright : C.plan}), `${f.t}: ${fmtM(f.v)}`);
    el(s, "text", {x:L + Math.max(2,(W-110)*f.v/vmax) + 8, y:y+25, "font-size":12.5, "font-weight":700, fill:C.navy}, fmtM(f.v));
  });
  document.getElementById("g-saldo").appendChild(s);
  
}

/* ---------------- pagos en trámite ---------------- */
const ETAPAS = [["acta","Acta"],["envio","Envío"],["entrada","Factura"],["tesoreria","Tesorería"],["pago","Pago"]];
function pendientes(d){
  const box = document.getElementById("pendientes");
  const pend = d.tramites.filter(t => t.estado !== "Pagado");
  if(!pend.length){ box.innerHTML = `<p class="nota">No hay pagos pendientes: todo lo certificado está cobrado.</p>`; return; }
  box.innerHTML = pend.map(t => {
    const ultima = ETAPAS.reduce((u, [k], i) => t[k] ? i : u, -1);
    const dots = ETAPAS.map(([k], i) => {
      const cls = i < ultima ? "hecha" : (i === ultima ? "actual" : "");
      return (i ? `<span class="t ${i <= ultima ? "hecha" : ""}"></span>` : "") + `<span class="e ${cls}" title="${ETAPAS[i][1]}${t[k] ? ": " + fmtFecha(t[k]) : ""}"></span>`;
    }).join("");
    const desde = ultima >= 0 ? `${ETAPAS[ultima][1]} ${fmtFecha(t[ETAPAS[ultima][0]])}` : `Emitido ${fmtFecha(t.fechaCert)}`;
    return `<div class="pend">
      <div><div class="nom">${esc(t.nombre)}</div><div class="etapa-txt">${esc(t.estado)}</div></div>
      <div class="monto">${fmtM(t.monto)}</div>
      <div><div class="etapas">${dots}</div><div class="etapa-txt">${desde}</div></div>
      <div class="fecha"><b>${fmtFecha(t.pagoEstimado)}</b><span>pago estimado</span></div>
    </div>`;
  }).join("");
}

let D = null, ENTRADAS = [], ENT = {}, SEL = null;
const MESES_LARGO = ["enero","febrero","marzo","abril","mayo","junio","julio","agosto","septiembre","octubre","noviembre","diciembre"];
const nrm = s => String(s ?? "").normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase().replace(/[^a-z0-9]+/g, " ").trim();
const romanoDe = n => (ROM[n] || "").toLowerCase();
const fmtPesos = v => v == null ? "—" : "$ " + fmtNum(v, 2);
const mesesEntre = (a, b) => (b.getFullYear() - a.getFullYear()) * 12 + (b.getMonth() - a.getMonth());


/* ---------------- plan de trabajo ---------------- */
function planNombre(d){
  const n = d.curva && d.curva.planNombre;
  return n ? n.replace(/PLAN DE TRABAJO/i, "Plan de trabajo").replace(/\s*-\s*/, " ").trim() : "Plan de trabajo";
}
function planFin(d){
  const c = d.curva || {}, pl = c.plan || c.planOriginal || [];
  const m = c.planFin || (pl.length ? pl[pl.length - 1].mes : null);
  return m ? m + "-01" : null;
}

function hayOrig(d){ const c = d.curva || {}; return !!(c.plan && c.planOriginal && c.planOriginal.length); }
function finOrig(d){ const c = d.curva || {}; return c.planOriginalFin ? c.planOriginalFin + "-01" : null; }
function notaPlanes(d){
  const fin = fmtMes(planFin(d));
  if(!hayOrig(d)) return `Avance acumulado certificado frente al ${planNombre(d)}, que prevé terminar en ${fin}. El fin vigente viene de la hoja SALDO del seguimiento.`;
  const fo = finOrig(d), igual = fo === planFin(d);
  return `Avance acumulado certificado frente al plan original y al ${planNombre(d)} (reprogramado). ${igual ? `Los dos prevén terminar en ${fin}` : `El original prevé terminar en ${fmtMes(fo)} y el reprogramado en ${fin}`}. El fin vigente viene de la hoja SALDO del seguimiento.`;
}
function cierrePlanes(d){
  const fin = fmtMes(planFin(d));
  if(!hayOrig(d)) return `La curva se compara con el ${planNombre(d)}, que prevé terminar en ${fin}.`;
  return `La curva se compara con el plan original y con el ${planNombre(d)} (reprogramado); ${finOrig(d) === planFin(d) ? `ambos prevén terminar en ${fin}` : `terminan en ${fmtMes(finOrig(d))} y ${fin}`}.`;
}
function tablaPlanes(d){
  const t = document.getElementById("t-planes"); if(!t) return;
  const c = d.curva, real = c.real, plan = c.plan, orig = c.planOriginal;
  const idx = m => mesIdx(m + "-01");
  const acumEn = (serie, m) => { let v = null; for(const x of serie){ if(idx(x.mes) <= idx(m)) v = x.pctAcum; else break; } return v; };
  const todos = [...real.map(r => r.mes), ...plan.map(r => r.mes), ...orig.map(r => r.mes)];
  const i0 = Math.min(...todos.map(idx)), i1 = Math.max(...real.map(r => idx(r.mes)));
  const dev = (a, b) => { if(a == null || b == null) return "—"; const v = (a - b) * 100;
    return `<span class="${v < -0.05 ? "excede-txt" : ""}">${v < -0.05 ? "−" : "+"}${fmtNum(Math.abs(v), 1)} pts</span>`; };
  let h = `<thead><tr><th>Mes</th><th class="n">Certificado</th><th class="n">Real</th><th class="n">Plan original</th><th class="n">${esc(planNombre(d))}</th><th class="n">Real contra original</th><th class="n">Real contra ${esc(planNombre(d))}</th></tr></thead><tbody>`;
  for(let i = i0; i <= i1; i++){
    const m = idxMes(i), r = acumEn(real, m), po = acumEn(orig, m) ?? 0, pp = acumEn(plan, m) ?? 0;
    const cert = real.find(x => x.mes === m);
    h += `<tr><td>${fmtMes(m + "-01")}</td><td class="n">${cert ? cert.n : "—"}</td><td class="n">${fmtPct(r)}</td><td class="n">${fmtPct(po)}</td><td class="n">${fmtPct(pp)}</td><td class="n">${dev(r, po)}</td><td class="n">${dev(r, pp)}</td></tr>`;
  }
  t.innerHTML = h + "</tbody>";
}

/* ---------------- vistas ---------------- */
function mostrar(v){
  for(const x of ["panel","consulta","def"]){ const e = document.getElementById("vista-" + x); if(e) e.hidden = (x !== v); }
  document.querySelectorAll(".nav-btn[data-vista]").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.vista === v)));

  D = d;
  construirIndice(d);
  renderDefiniciones(d);

  document.querySelectorAll("nav.secciones [data-ir]").forEach(a => a.addEventListener("click", e => {

    document.getElementById(a.dataset.ir).scrollIntoView();
  }));
  document.querySelectorAll(".nav-btn[data-vista]").forEach(b => b.addEventListener("click", () => {

      mostrar(b.dataset.vista);

  listarConsulta("");

  window.addEventListener("hashchange", aplicarHash);

function aplicarHash(){
  const h = decodeURIComponent(location.hash.slice(1));
  if(!h) return;
  if(h === "definiciones"){ mostrar("def"); return; }
  if(h === "consulta"){ mostrar("consulta"); return; }
  if(["avance","valores","proyeccion"].includes(h)){ mostrar("panel"); const s = document.getElementById(h); if(s) s.scrollIntoView(); return; }
  if(ENT[h]){ mostrar("consulta"); seleccionar(h, {hash:false, scroll:false}); }
}

/* ---------------- índice de búsqueda ---------------- */
function estadoCorto(t){ return t ? t.estado : ""; }

function construirIndice(d){
  const E = [];
  const tram = (tipo, f) => d.tramites.find(t => t.tipo === tipo && f(t));
  [...d.certificados].reverse().forEach(c => {
    const t = tram("certificado", x => x.n === c.n), f = parseISO(c.mes + "-01");
    E.push({id:`cert-${c.n}`, g:"Certificados", t:`Certificado Nº ${c.n}`, s:`${fmtMes(c.mes+"-01")}, neto ${fmtM(c.neto)}`,
      est:estadoCorto(t), pend:!!t && t.estado !== "Pagado",
      hay:nrm(`certificado cert ${c.n} ${fmtMes(c.mes+"-01")} ${MESES_LARGO[f.getMonth()]} ${f.getFullYear()}`), html:() => fichaCert(c, t)});
  });
  [...d.ajustes].reverse().forEach(a => {
    const t = tram("ajuste", x => x.redet === a.redet);
    E.push({id:`ajuste-${a.redet}`, g:"Ajustes por redeterminación", t:`Ajuste por Redet. ${ROM[a.redet] || a.redet}`,
      s:`${fmtFecha(a.fecha)}, ${fmtM(a.netoConAnticipo ?? a.neto)}`, est:estadoCorto(t), pend:!!t && t.estado !== "Pagado",
      hay:nrm(`ajuste ajustes redet ${a.redet} ${romanoDe(a.redet)} ${fmtFecha(a.fecha)}`), html:() => fichaAjuste(a, t)});
  });
  d.anticipos.forEach(a => {
    const pct = Math.round(a.pct * 100), t = tram("anticipo", x => x.nombre === `Anticipo ${pct} %`);
    E.push({id:`anticipo-${pct}`, g:"Anticipos", t:`Anticipo ${pct} %`, s:`${fmtFecha(a.fecha)}, ${fmtM(a.monto)}`,
      est:estadoCorto(t), pend:!!t && t.estado !== "Pagado", hay:nrm(`anticipo anticipos financiero ${pct}`), html:() => fichaAnticipo(a, t)});
  });
  d.redeterminaciones.filter(r => r.redet > 0).forEach(r => {
    E.push({id:`redet-${r.redet}`, g:"Redeterminaciones", t:`Redeterminación ${ROM[r.redet] || r.redet}`,
      s:`Salto ${fmtMes(r.mesSalto)}, contrato ${fmtM(r.monto)}`, est:"", pend:false,
      hay:nrm(`redeterminacion redeterminaciones redet ${r.redet} ${romanoDe(r.redet)} salto ${fmtMes(r.mesSalto)}`), html:() => fichaRedet(r)});
  });
  d.items.forEach(i => {
    E.push({id:`item-${i.codigo}`, g:"Ítems del presupuesto", t:`Ítem ${i.codigo}`, s:i.descripcion,
      est:fmtNum((i.pctAcum||0)*100, 0) + " %", pend:false,
      hay:nrm(`item items ${i.codigo} ${i.descripcion} ${i.grupo||""} ${i.rubro||""} ${i.unidad}`), html:() => fichaItem(i)});
  });
  ENTRADAS = E; ENT = {};
  for(const e of E) ENT[e.id] = e;
}

function listarConsulta(q){
  const toks = nrm(q).split(" ").filter(Boolean);
  const cumple = e => { const w = e.hay.split(" ");
    return toks.every(t => (/^\d+$/.test(t) || /^[ivx]+$/.test(t)) ? w.includes(t) : w.some(x => x.startsWith(t))); };
  const res = ENTRADAS.filter(cumple);
  let h = "", g = null;
  for(const e of res){
    if(e.g !== g){ g = e.g; h += `<div class="cons-g">${esc(g)}</div>`; }
    h += `<button type="button" class="cons-it${e.id === SEL ? " sel" : ""}" data-id="${esc(e.id)}"><span class="t">${esc(e.t)}</span>` +
         `<span class="est${e.pend ? " abierto" : ""}">${esc(e.est || "")}</span><span class="s">${esc(e.s)}</span></button>`;
  }
  if(!res.length) h = `<div class="cons-vacio">No hay resultados para «${esc(q)}». Probá con «cert 12», «ajuste 3», «redet IV» o parte del nombre de un ítem.</div>`;
  document.getElementById("cons-res").innerHTML = h;
}

function seleccionar(id, {hash = true, scroll = true} = {}){
  const e = ENT[id]; if(!e) return;
  SEL = id;
  const fi = document.getElementById("cons-ficha");
  fi.innerHTML = e.html();
  document.querySelectorAll(".cons-it").forEach(b => b.classList.toggle("sel", b.dataset.id === id));
  if(hash) history.replaceState(null, "", "#" + id);
  if(scroll && window.matchMedia("(max-width:900px)").matches) fi.scrollIntoView({block:"start"});
}

const fila = (l, v, cls = "", vcls = "") => `<div class="f-fila ${cls}"><span>${l}</span><span class="v ${vcls}">${v}</span></div>`;
const chip = (id, txt) => ENT[id] ? `<button type="button" class="chip" data-id="${esc(id)}">${esc(txt)}</button>` : esc(txt);
const fHead = (tit, sub) => `<h3 class="f-tit">${esc(tit)}</h3><p class="f-sub">${sub}</p>`;

function circuito(t){
  if(!t) return `<p class="f-nota">Este comprobante no figura en la TABLA MASTER del seguimiento.</p>`;
  const et = [["fechaCert","Emitido"],["acta","Acta de medición"],["envio","Enviado al contratista"],["entrada","Factura recibida"],["tesoreria","Entregado a Tesorería"],["pago","Pagado"]];
  const pasos = et.filter(([k]) => t[k]).map(([k, l]) => ({l, f:t[k]})).sort((a, b) => a.f.localeCompare(b.f));
  let prev = null, h = `<div class="tabla-wrap"><table class="f-pasos"><thead><tr><th>Etapa</th><th>Fecha</th><th class="n">Días desde la anterior</th></tr></thead><tbody>`;
  for(const p of pasos){
    const dias = prev ? Math.round((parseISO(p.f) - parseISO(prev)) / 864e5) : null;
    h += `<tr><td>${p.l}</td><td>${fmtFecha(p.f)}</td><td class="n d">${dias == null ? "—" : dias}</td></tr>`;
    prev = p.f;
  }
  h += `</tbody></table></div>`;
  h += t.estado === "Pagado"
    ? `<p class="f-nota">Desde la emisión hasta el pago: <b>${t.diasCertAPago ?? "—"} días</b>.</p>`
    : `<p class="f-nota">En trámite: <b>${esc(t.estado)}</b>. Pago estimado: <b>${fmtFecha(t.pagoEstimado)}</b>.</p>`;
  return h;
}
function extrasT(t){
  if(!t) return "";
  let h = "";
  if(t.factura) h += `<div class="f-sec"><h4>Factura</h4><p class="f-nota">${esc(t.factura)}</p></div>`;
  if(t.poliza) h += `<div class="f-sec"><h4>Garantías</h4><p class="f-nota">${esc(t.poliza)}</p></div>`;
  if(t.obs) h += `<div class="f-sec"><h4>Observaciones del seguimiento</h4><p class="f-nota">${esc(t.obs)}</p></div>`;
  return h;
}

function generarPDF(){
  const dlg = document.getElementById("dlg-pdf");
  const marcados = new Set([...dlg.querySelectorAll("input:checked")].map(i => i.value));
  dlg.close();
  mostrar("panel");
  const tocados = [], abiertos = [];
  document.querySelectorAll("#vista-panel [data-pdf]").forEach(el => { if(!marcados.has(el.dataset.pdf)){ el.classList.add("pdf-oculto"); tocados.push(el); } });
  document.querySelectorAll("#vista-panel section").forEach(sec => {
    const hijos = sec.querySelectorAll("[data-pdf]");
    if(hijos.length && [...hijos].every(h => h.classList.contains("pdf-oculto"))){ sec.classList.add("pdf-oculto"); tocados.push(sec); }
  });
  if(marcados.has("historial")) document.querySelectorAll('[data-pdf="historial"] details').forEach(x => { abiertos.push([x, x.open]); x.open = true; });
  const tituloPrevio = document.title;
  document.title = `Certificaciones ${D.obra.nombre} - datos al ${String(D.generatedAt).replace(/\//g, "-")}`;
  const limpiar = () => {
    tocados.forEach(el => el.classList.remove("pdf-oculto"));
    abiertos.forEach(([x, v]) => { x.open = v; });
    document.title = tituloPrevio;
    window.removeEventListener("afterprint", limpiar);
  };
  window.addEventListener("afterprint", limpiar);
  window.scrollTo(0, 0);
  setTimeout(() => window.print(), 80);
}


/* ============================================================
   Índice general de certificaciones (certificaciones.html sin ?obra=)
   Lee certificaciones_indice.json: todos los comprobantes de la planilla de seguimiento.
   El estado, las demoras y los pagos estimados se calculan acá con la fecha de hoy.
   ============================================================ */
async function traerJSON(nombre){
  for(const ruta of ["data/" + nombre, nombre]){
    try{ const r = await fetch(ruta, {cache:"no-store"}); if(r.ok) return await r.json(); }catch(e){ /* prueba la otra ubicación */ }
  }
  throw new Error("sin datos");
}

function cargarIndice(){
  traerJSON("certificaciones_indice.json").then(renderIndice).catch(() => {
    app.innerHTML = `<div class="estado-msg"><h2>Todavía no hay datos del índice</h2>
      <p>No se encontró <code>certificaciones_indice.json</code>, ni en la carpeta <code>data</code> ni junto a esta página.
      Se genera corriendo <code>actualizar_certificaciones.py</code> con la planilla de seguimiento de certificaciones.</p>
      <p>Para ver el panel de una obra, agregá la obra a la dirección, por ejemplo <code>certificaciones.html?obra=mechita</code>.</p></div>`;
  });
}

const IX = {d:null, hoy:null, mes:null, modo:"curso", obra:"", empresa:"", q:"", C:[], porId:{}};
const ETA = [
  {k:"acta",      corto:"Acta",      largo:"Acta de medición",      estado:"Acta de medición"},
  {k:"envio",     corto:"Envío",     largo:"Enviado al contratista", estado:"Enviado al contratista"},
  {k:"entrada",   corto:"Factura",   largo:"Factura recibida",       estado:"Factura recibida"},
  {k:"tesoreria", corto:"Tesorería", largo:"Entregado a Tesorería",  estado:"En Tesorería"},
  {k:"pago",      corto:"Pago",      largo:"Pagado",                 estado:"Pagado"},
];
const ETA_K = Object.fromEntries(ETA.map(e => [e.k, e]));
const QUIEN = {
  acta:      {quien:"bagsa",       txt:"con el acta hecha"},
  envio:     {quien:"contratista", txt:"enviado al contratista"},
  entrada:   {quien:"bagsa",       txt:"con la factura recibida"},
  tesoreria: {quien:"tesoreria",   txt:"en Tesorería"},
};
const ACCION = {
  acta:"Enviar el certificado al contratista", envio:"Esperar la factura del contratista",
  entrada:"Entregar la factura a Tesorería", tesoreria:"Esperar el pago",
};
const gid = id => document.getElementById(id);
const addDays = (d, n) => new Date(d.getFullYear(), d.getMonth(), d.getDate() + n);
const ymd = d => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
const fmtDate = d => d ? d.toLocaleDateString("es-AR", {day:"2-digit", month:"2-digit", year:"numeric"}) : "—";
const diasTxt = n => `${n} ${n === 1 ? "día" : "días"}`;
const movil = () => window.matchMedia("(max-width:700px)").matches;

function prepararIx(d){
  const R = d.reglas, M = d.medianas;
  IX.d = d;
  IX.C = d.comprobantes.map(c => {
    const x = {...c, fechas:{}};
    for(const e of ETA) if(c[e.k]) x.fechas[e.k] = parseISO(c[e.k]);
    let et = null; for(const e of ETA) if(x.fechas[e.k]) et = e.k;     // etapa más avanzada
    x.etapa = et; x.fEtapa = et ? x.fechas[et] : null; x.pagado = et === "pago";
    x.dias = (!x.pagado && x.fEtapa) ? Math.round((IX.hoy - x.fEtapa) / 864e5) : null;
    const med = (et && M[et] != null) ? M[et] : null;
    x.med = med;
    x.estimado = (!x.pagado && x.fEtapa && med != null) ? addDays(x.fEtapa, med) : null;
    x.antiguo = !x.pagado && (!x.fEtapa || x.dias > R.antiguoDias);
    x.demorado = !x.pagado && !x.antiguo && med != null && x.dias > med * R.demoraFactor;
    x.estadoTxt = et ? ETA_K[et].estado : "Sin fechas";
    x.hay = nrm(`${x.obra} ${x.empresa} ${x.label} ${x.tema} ${x.estadoTxt}`);
    return x;
  });
  IX.porId = Object.fromEntries(IX.C.map(c => [String(c.id), c]));
}

function visiblesIx(){
  const toks = nrm(IX.q).split(" ").filter(Boolean);
  return IX.C.filter(c => (!IX.obra || c.obraKey === IX.obra) && (!IX.empresa || c.empresa === IX.empresa) &&
    toks.every(t => c.hay.includes(t)));
}
const sumaIx = a => a.reduce((s, c) => s + (c.monto || 0), 0);

function pintarIx(){
  const vis = visiblesIx();
  pintarKpis(vis);
  pintarActivos();
  pintarCal();
  pintarMover(vis);
  pintarObras();
}

function pintarActivos(){
  const o = IX.d.obras.find(x => x.key === IX.obra);
  const p = [];
  if(IX.obra) p.push(`<button type="button" class="ix-pill" data-quitar="obra">Obra: ${esc(o ? o.nombre : IX.obra)} ✕</button>`);
  if(IX.empresa) p.push(`<button type="button" class="ix-pill" data-quitar="empresa">Empresa: ${esc(IX.empresa)} ✕</button>`);
  if(IX.q.trim()) p.push(`<button type="button" class="ix-pill" data-quitar="q">Búsqueda: ${esc(IX.q.trim())} ✕</button>`);
  gid("ix-activos").innerHTML = p.join("");
}

/* ---------------- indicadores ---------------- */
function pintarKpis(vis){
  const act = vis.filter(c => !c.pagado && !c.antiguo);
  const anio = IX.hoy.getFullYear();
  const pag = vis.filter(c => c.pagado && c.fechas.pago.getFullYear() === anio);
  const lim = addDays(IX.hoy, 30);
  const esp = act.filter(c => c.estimado && c.estimado <= lim);
  const atras = esp.filter(c => c.estimado < IX.hoy).length;
  const dem = act.filter(c => c.demorado).length, ant = vis.filter(c => c.antiguo).length;
  const obrasAct = new Set(act.map(c => c.obraKey)).size;
  gid("ix-kpis").innerHTML = `
    <div class="kpi"><div class="l">En trámite</div><div class="v">${fmtM(sumaIx(act))}</div>
      <div class="s"><b>${act.length}</b> comprobantes sin pagar, de ${obrasAct} ${obrasAct === 1 ? "obra" : "obras"}. No incluye los ${ant} para revisar</div></div>
    <div class="kpi"><div class="l">Pagado en ${anio}</div><div class="v">${fmtM(sumaIx(pag))}</div>
      <div class="s"><b>${pag.length}</b> ${pag.length === 1 ? "pago" : "pagos"} en lo que va del año</div></div>
    <div class="kpi"><div class="l">Pagos esperados, próximos 30 días</div><div class="v">${fmtM(sumaIx(esp))}</div>
      <div class="s"><b>${esp.length}</b> ${esp.length === 1 ? "comprobante" : "comprobantes"}${atras ? `, ${atras} con la fecha estimada ya vencida` : ""}</div></div>
    <div class="kpi"><div class="l">Demorados y para revisar</div><div class="v">${dem + ant}</div>
      <div class="s"><b>${dem}</b> demorados en su etapa y <b>${ant}</b> antiguos o sin fechas, que probablemente tienen el pago sin cargar</div></div>`;
}

/* ---------------- calendario ---------------- */
function eventosIx(){
  const ev = [];
  for(const c of visiblesIx()){
    const pres = ETA.filter(e => c.fechas[e.k]);
    if(IX.modo === "curso"){
      if(c.pagado || c.antiguo) continue;
      pres.slice(-2).forEach(e => ev.push({c, k:e.k, f:c.fechas[e.k], est:false}));
    } else {
      pres.forEach(e => ev.push({c, k:e.k, f:c.fechas[e.k], est:false}));
    }
    if(!c.pagado && !c.antiguo && c.estimado) ev.push({c, k:"pago", f:c.estimado, est:true});
  }
  const rango = {pago:5, tesoreria:4, entrada:3, envio:2, acta:1};
  return ev.sort((a, b) => (rango[b.k] - rango[a.k]) || a.c.obra.localeCompare(b.c.obra));
}

function chipIx(x){
  const c = x.c, e = ETA_K[x.k];
  const atrasado = x.est && x.f < IX.hoy;
  const corto = x.est ? "Pago est." : e.corto;
  let tip = `${x.est ? "Pago estimado" : e.largo}: ${c.obra}, ${c.label} (${c.empresa})`;
  if(c.demorado) tip += `. Demorado: ${diasTxt(c.dias)} en esta etapa, lo normal es hasta ${Math.round(c.med * IX.d.reglas.demoraFactor)}`;
  if(atrasado) tip += ". La fecha estimada ya pasó";
  return `<button type="button" class="ev ev-${x.k}${x.est ? " est" : ""}${atrasado ? " atrasado" : ""}${c.demorado ? " dem" : ""}" data-id="${c.id}" title="${esc(tip)}" aria-label="${esc(tip)}"><span class="tx"><b>${corto}</b><span class="nm">${esc(c.obra)} ${esc(c.label)}</span></span></button>`;
}

function pintarCal(){
  const y = IX.mes.getFullYear(), m = IX.mes.getMonth();
  gid("cal-mes").textContent = `${MESES_LARGO[m]} ${y}`;
  const mapa = {};
  for(const x of eventosIx()){ (mapa[ymd(x.f)] ||= []).push(x); }
  const offset = (IX.mes.getDay() + 6) % 7;
  const ini = new Date(y, m, 1 - offset);
  const dias = new Date(y, m + 1, 0).getDate();
  const filas = Math.ceil((offset + dias) / 7);
  let h = "", delMes = 0;
  for(let i = 0; i < filas * 7; i++){
    const f = new Date(ini.getFullYear(), ini.getMonth(), ini.getDate() + i);
    const k = ymd(f), ev = mapa[k] || [], fuera = f.getMonth() !== m;
    if(!fuera) delMes += ev.length;
    const max = 3;
    h += `<div class="dia${fuera ? " fuera" : ""}${ymd(f) === ymd(IX.hoy) ? " hoy" : ""}" data-f="${k}">
      <button type="button" class="dn" data-dia aria-label="Ver el ${f.getDate()} de ${MESES_LARGO[f.getMonth()]}">${f.getDate()}</button>
      <div class="evs">${ev.slice(0, max).map(chipIx).join("")}</div>
      ${ev.length > max ? `<button type="button" class="mas" data-dia>+${ev.length - max} más</button>` : ""}</div>`;
  }
  gid("cal-grid").innerHTML = h;
  const vacio = gid("cal-vacio");
  vacio.hidden = delMes > 0;
  vacio.textContent = IX.modo === "curso"
    ? "No hay trámites en curso con fechas en este mes. Probá con el mes siguiente o pasá a Historial para ver lo que ya pasó."
    : "No hay movimientos con estos filtros en este mes.";
}

function abrirDiaIx(k){
  const evs = eventosIx().filter(x => ymd(x.f) === k);
  const f = parseISO(k);
  gid("dlg-dia").innerHTML = `<button type="button" class="cerrar" data-cerrar>Cerrar</button>
    <h3 class="f-tit">${f.getDate()} de ${MESES_LARGO[f.getMonth()]} de ${f.getFullYear()}</h3>
    <div class="dia-lista">${evs.length ? evs.map(x => {
      const e = ETA_K[x.k], c = x.c;
      return `<button type="button" class="mv" data-id="${c.id}"><span class="t"><span class="pto ev-${x.k}"></span>${x.est ? "Pago estimado" : e.largo}${c.demorado ? '<span class="tag">demorado</span>' : ""}</span>
        <span class="s">${esc(c.obra)}, ${esc(c.label)}. ${esc(c.empresa)}</span></button>`;
    }).join("") : '<p class="mv-vacio">No hay movimientos este día con los filtros actuales.</p>'}</div>`;
  gid("dlg-dia").showModal();
}

/* ---------------- para mover hoy ---------------- */
function enEtapaTxt(c){
  const q = QUIEN[c.etapa];
  return `${c.dias <= 0 ? "Hoy" : "Hace " + diasTxt(c.dias)}, ${q ? q.txt : ""}`;
}
function filaMover(c, conEstimado){
  return `<button type="button" class="mv" data-id="${c.id}"><span class="t">${esc(c.obra)}, ${esc(c.label)}${c.demorado ? '<span class="tag">demorado</span>' : ""}</span>
    <span class="s">${enEtapaTxt(c)}${conEstimado && c.estimado ? `. Pago estimado el ${fmtDate(c.estimado)}` : ""}</span></button>`;
}
function pintarMover(vis){
  const act = vis.filter(c => !c.pagado && !c.antiguo);
  const porDias = (a, b) => b.dias - a.dias;
  const g1 = act.filter(c => QUIEN[c.etapa] && QUIEN[c.etapa].quien === "bagsa").sort(porDias);
  const g2 = act.filter(c => c.etapa === "envio").sort(porDias);
  const g3 = act.filter(c => c.etapa === "tesoreria").sort((a, b) => (a.estimado - b.estimado));
  const rev = vis.filter(c => c.antiguo).sort((a, b) => (b.dias ?? -1) - (a.dias ?? -1));
  const grupo = (t, s, a, est, vacio) => `<div class="mv-g"><h4>${t} (${a.length})</h4><div class="sub">${s}</div>${a.length ? a.map(c => filaMover(c, est)).join("") : `<div class="mv-vacio">${vacio}</div>`}</div>`;
  gid("mover").innerHTML = `<h3>Para mover hoy</h3>
    <p class="nota" style="margin:2px 0 0">Trámites sin pagar, según la etapa en que están.</p>
    ${grupo("Te toca a vos", "Acta lista para enviar al contratista, o factura para entregar a Tesorería", g1, true, "Nada pendiente de tu lado.")}
    ${grupo("Esperan al contratista", "Enviados, falta la factura", g2, true, "Ninguno.")}
    ${grupo("Esperan el pago", "Ya están en Tesorería", g3, true, "Ninguno.")}
    <details><summary>Para revisar (${rev.length})</summary>
      <p class="f-nota">Más de ${IX.d.reglas.antiguoDias} días sin movimiento o sin ninguna fecha. Probablemente ya se pagaron y falta cargar el pago.</p>
      ${rev.length ? rev.map(c => `<button type="button" class="mv" data-id="${c.id}"><span class="t">${esc(c.obra)}, ${esc(c.label)}</span>
        <span class="s">${c.fEtapa ? `Último movimiento hace ${diasTxt(c.dias)}: ${ETA_K[c.etapa].largo.toLowerCase()}` : "Sin ninguna fecha cargada"}. ${esc(c.empresa)}</span></button>`).join("") : '<div class="mv-vacio">Nada para revisar.</div>'}
    </details>`;
}

/* ---------------- obras ---------------- */
function pintarObras(){
  const d = IX.d;
  const filas = d.obras.map(o => {
    const cs = IX.C.filter(c => c.obraKey === o.key);
    const pag = cs.filter(c => c.pagado), act = cs.filter(c => !c.pagado && !c.antiguo), rev = cs.filter(c => c.antiguo).length;
    const ult = pag.reduce((m, c) => (!m || c.fechas.pago > m) ? c.fechas.pago : m, null);
    return {o, n:cs.length, pag, act, rev, ult};
  }).sort((a, b) => (sumaIx(b.act) - sumaIx(a.act)) || ((b.ult || 0) - (a.ult || 0)));
  gid("ix-obras").innerHTML = filas.map(({o, n, pag, act, rev, ult}) => `
    <article class="obra-card${IX.obra === o.key ? " sel" : ""}">
      <div><h3>${esc(o.nombre)}</h3><div class="emp">${esc(o.empresas.join(", "))}</div></div>
      <div class="oc-nums">
        <div><span class="l">Pagado</span><b>${fmtM(sumaIx(pag))}</b><span class="s">${pag.length} ${pag.length === 1 ? "pago" : "pagos"}</span></div>
        <div><span class="l">En trámite</span><b>${fmtM(sumaIx(act))}</b><span class="s">${act.length} ${act.length === 1 ? "comprobante" : "comprobantes"}</span></div>
      </div>
      <div class="oc-pie"><span>${n} comprobantes</span><span>Último pago: ${ult ? fmtDate(ult) : "—"}</span>${rev ? `<span class="tag">${rev} para revisar</span>` : ""}</div>
      <div class="oc-acc">
        <button type="button" class="btn" data-filtrar="${esc(o.key)}">${IX.obra === o.key ? "Quitar filtro" : "Ver en el calendario"}</button>
        ${o.panel ? `<a class="btn prim" href="certificaciones.html?obra=${encodeURIComponent(o.panel)}">Abrir panel</a>` : '<span class="sin">Sin panel todavía</span>'}
      </div>
    </article>`).join("");
}

/* ---------------- ficha de un comprobante ---------------- */
function enlacePanelIx(c){
  const o = IX.d.obras.find(x => x.key === c.obraKey);
  if(!o || !o.panel) return "";
  let h = "";
  if(c.tipo === "certificado" && c.n != null) h = `#cert-${c.n}`;
  else if(c.tipo === "ajuste" && c.redet) h = `#ajuste-${c.redet}`;
  else if(c.tipo === "anticipo" && c.pct) h = `#anticipo-${Math.round(c.pct * 100)}`;
  return `certificaciones.html?obra=${encodeURIComponent(o.panel)}${h}`;
}

function abrirFichaIx(id){
  const c = IX.porId[String(id)]; if(!c) return;
  const pasos = ETA.filter(e => c.fechas[e.k]).map(e => ({l:e.largo, f:c.fechas[e.k]})).sort((a, b) => a.f - b.f);
  let prev = null, tabla = "";
  if(pasos.length){
    tabla = `<div class="tabla-wrap"><table class="f-pasos"><thead><tr><th>Etapa</th><th>Fecha</th><th class="n">Días desde la anterior</th></tr></thead><tbody>` +
      pasos.map(p => { const dd = prev ? Math.round((p.f - prev) / 864e5) : null; prev = p.f;
        return `<tr><td>${p.l}</td><td>${fmtDate(p.f)}</td><td class="n d">${dd == null ? "—" : dd}</td></tr>`; }).join("") + `</tbody></table></div>`;
  }
  let situacion = "";
  if(c.pagado){
    situacion = `<p class="f-nota">Desde la primera fecha cargada hasta el pago: <b>${diasTxt(Math.round((c.fechas.pago - pasos[0].f) / 864e5))}</b>.</p>`;
  } else if(c.antiguo){
    situacion = `<p class="f-nota"><b>Para revisar:</b> ${c.fEtapa ? `lleva ${diasTxt(c.dias)} sin movimiento` : "no tiene ninguna fecha cargada"}. Probablemente ya se pagó y falta cargar el pago en la planilla.</p>`;
  } else {
    situacion = `<p class="f-nota">${c.demorado ? `<b>Demorado:</b> lleva ${diasTxt(c.dias)} en esta etapa y lo normal es hasta ${Math.round(c.med * IX.d.reglas.demoraFactor)}. ` : ""}Falta: <b>${ACCION[c.etapa]}</b>.${c.estimado ? ` Pago estimado el <b>${fmtDate(c.estimado)}</b>.` : ""}</p>`;
  }
  const enlace = enlacePanelIx(c);
  gid("dlg-ficha").innerHTML = `<button type="button" class="cerrar" data-cerrar>Cerrar</button>
    <h3 class="f-tit">${esc(c.obra)}, ${esc(c.label)}</h3>
    <p class="f-sub">${esc(c.empresa)}. ${esc(c.tema)}</p>
    <div class="f-sec"><h4>Estado</h4>
      ${fila("Etapa actual", esc(c.estadoTxt), "", c.antiguo || c.demorado ? "alerta" : "")}
      ${fila("Monto a pagar", fmtM(c.monto), "total")}
    </div>
    <div class="f-sec"><h4>Circuito de cobro</h4>${tabla || '<p class="f-nota">No tiene fechas cargadas.</p>'}${situacion}</div>
    ${c.factura ? `<div class="f-sec"><h4>Factura</h4><p class="f-nota">${esc(c.factura)}</p></div>` : ""}
    ${c.poliza ? `<div class="f-sec"><h4>Garantías</h4><p class="f-nota">${esc(c.poliza)}</p></div>` : ""}
    ${c.obs ? `<div class="f-sec"><h4>Observaciones del seguimiento</h4><p class="f-nota">${esc(c.obs)}</p></div>` : ""}
    ${enlace ? `<p style="margin:18px 0 0"><a class="btn prim" href="${enlace}" style="text-decoration:none;display:inline-block">Abrir en el panel de ${esc(c.obra)}</a></p>` : ""}`;
  gid("dlg-ficha").showModal();
}

/* ---------------- cómo se calcula y control de datos ---------------- */
function comoIx(d){
  const m = d.medianas, r = d.reglas;
  return `<ul class="ix-como" style="padding-left:18px">
    <li><b>Etapas.</b> Acta de medición, envío al contratista, factura recibida, entrega a Tesorería y pago. Cada trámite está en la etapa más avanzada que tiene fecha. Las fechas salen de la TABLA MASTER del seguimiento.</li>
    <li><b>En trámite.</b> Comprobantes sin fecha de pago y con un movimiento de hace menos de ${r.antiguoDias} días.</li>
    <li><b>Pago estimado.</b> Fecha de la última etapa más los días que suele tardar desde esa etapa hasta el pago, que son la mediana de todas las obras sin contar a TGS: ${m.acta} desde el acta, ${m.envio} desde el envío, ${m.entrada} desde la factura y ${m.tesoreria} desde Tesorería.</li>
    <li><b>Demorado.</b> Lleva en su etapa más de ${String(r.demoraFactor).replace(".", ",")} veces esos días.</li>
    <li><b>Para revisar.</b> Más de ${r.antiguoDias} días sin movimiento o sin ninguna fecha. Se supone que el pago está sin cargar, y por eso no se suman al trámite ni al calendario en curso.</li>
    <li><b>Quién mueve cada etapa.</b> Le toca a BAGSA enviar el acta al contratista y entregar la factura a Tesorería. Después de enviar espera al contratista, y en Tesorería espera el pago.</li>
    <li><b>Montos.</b> Es el «monto a pagar» de la planilla, y solo se ven en los indicadores, las tarjetas de obra y las fichas.</li>
  </ul>`;
}

function avisosIx(d){
  const por = t => d.avisos.filter(a => a.tipo === t);
  const lista = (titulo, a) => a.length ? `${titulo ? `<h4>${titulo} (${a.length})</h4>` : ""}<ul>${a.map(x => `<li><span class="fila">Fila ${x.fila}.</span> ${esc(x.texto)}</li>`).join("")}</ul>` : "";
  const graves = por("desorden").filter(a => !a.leve), leves = por("desorden").filter(a => a.leve);
  const cuerpo = lista("Sin obra asignada", por("sin_obra")) + lista("Fechas que parecen mal cargadas", por("fecha_rara")) +
    lista("Texto en lugar de fecha", por("texto_en_fecha")) + lista("Etapas en desorden por más de 3 días", graves) +
    (leves.length ? `<details style="margin-top:12px"><summary>Etapas en desorden por 3 días o menos (${leves.length})</summary>${lista("", leves)}</details>` : "");
  return `<p class="nota" style="margin-top:8px">Diferencias de la planilla de seguimiento que conviene corregir en el Excel. El número de fila es el de la hoja TABLA MASTER.</p>${cuerpo || "<p>No se encontraron problemas.</p>"}`;
}

</script>
